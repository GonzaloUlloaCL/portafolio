// ================================================================== geometría del modelo
const muroPorId = (id) => P.muros.find((m) => m.id === id);
function geo(m) {
  const dx = m.x2 - m.x1, dy = m.y2 - m.y1, L = Math.hypot(dx, dy) || 1e-6;
  return { dx, dy, L, ux: dx / L, uy: dy / L, nx: -dy / L, ny: dx / L, ang: Math.atan2(dy, dx) };
}
const vanosDe = (m) => P.vanos.filter((v) => v.muro === m.id).sort((a, b) => a.s - b.s);
// Tramos sólidos de un muro: [s0, s1, z0, z1] a lo largo del muro
function tramos(m) {
  const g = geo(m), out = []; let s = 0;
  for (const v of vanosDe(m)) {
    const a = Math.max(0, v.s - v.ancho / 2), b = Math.min(g.L, v.s + v.ancho / 2);
    if (a > s) out.push([s, a, 0, m.alto]);
    if (v.tipo === 'ventana' && v.antepecho > 0) out.push([a, b, 0, v.antepecho]);
    const cab = v.antepecho + v.alto;
    if (cab < m.alto) out.push([a, b, cab, m.alto]);
    s = Math.max(s, b);
  }
  if (s < g.L) out.push([s, g.L, 0, m.alto]);
  return out;
}
const area = (r) => r.w * r.d;
// ¿El muro está en el borde de este recinto? Devuelve el largo que comparten.
function enBorde(m, r) {
  const g = geo(m), tol = m.esp / 2 + 0.15;
  const lados = [[r.x, r.y, r.x + r.w, r.y], [r.x, r.y + r.d, r.x + r.w, r.y + r.d], [r.x, r.y, r.x, r.y + r.d], [r.x + r.w, r.y, r.x + r.w, r.y + r.d]];
  let mejor = 0;
  for (const [ax, ay, bx, by] of lados) {
    const lx = bx - ax, ly = by - ay, LL = Math.hypot(lx, ly), ux = lx / LL, uy = ly / LL;
    // paralelo
    if (Math.abs(g.ux * uy - g.uy * ux) > 0.02) continue;
    // distancia perpendicular del muro a la línea del lado
    const dist = Math.abs((m.x1 - ax) * -uy + (m.y1 - ay) * ux);
    if (dist > tol) continue;
    const t1 = (m.x1 - ax) * ux + (m.y1 - ay) * uy, t2 = (m.x2 - ax) * ux + (m.y2 - ay) * uy;
    const sol = Math.min(LL, Math.max(t1, t2)) - Math.max(0, Math.min(t1, t2));
    mejor = Math.max(mejor, sol);
  }
  return mejor > 0.1 ? mejor : 0;
}
const dentro = (o, r) => o.x >= r.x && o.x <= r.x + r.w && o.y >= r.y && o.y <= r.y + r.d;
function posVano(v) { const m = muroPorId(v.muro); const g = geo(m); return [m.x1 + g.ux * v.s, m.y1 + g.uy * v.s]; }

// ================================================================== cubicación (el método de Luciano: recinto por recinto)
function cubicar() {
  const secciones = [];
  const it = (clave, desc, un, q, estado) => ({ clave, desc, un, q: q == null ? null : Math.round(q * 100) / 100, estado });
  const recs = P.recintos;
  // dueño de cada muro: el primer recinto en cuyo borde está
  const dueno = new Map();
  for (const m of P.muros) { const r = recs.find((r) => enBorde(m, r) > 0); if (r) dueno.set(m.id, r.id); }
  const lote = P.lote, perLote = 2 * ((lote.x1 - lote.x0) + (lote.y1 - lote.y0));
  const areaTotal = recs.reduce((s, r) => s + area(r), 0);
  secciones.push({ titulo: 'TRABAJOS PREVIOS', grupos: [
    { t: 'Instalación de faenas', items: [
      it('cierre', 'Cierre perimetral provisorio', 'ml', perLote, 'Plano'),
      it('faenas', 'Instalación de faenas (oficina, bodega, servicios)', 'gl', 1, 'Global'),
      it('empalmes', 'Empalmes provisorios de luz y agua', 'gl', 1, 'Global')] },
    { t: 'Trazado', items: [it('trazado', 'Trazado, replanteo y niveles', 'm²', areaTotal, 'Plano')] }] });
  const demol = P.muros.filter((m) => m.estado === 'demoler').reduce((s, m) => s + geo(m).L * m.alto, 0);
  const retiro = recs.filter((r) => r.retiroPiso).reduce((s, r) => s + area(r), 0);
  const itemsB = [];
  if (demol) itemsB.push(it('demol', 'Demolición de muros existentes', 'm²', demol, 'Plano'));
  if (retiro) itemsB.push(it('retiro', 'Retiro de piso existente', 'm²', retiro, 'Plano'));
  itemsB.push(it('escombros', 'Retiro de escombros a botadero', 'gl', 1, 'Global'));
  itemsB.push(it('aseo', 'Aseo durante la obra y entrega', 'm²', areaTotal, 'Plano'));
  secciones.push({ titulo: 'DEMOLICIÓN, RETIRO Y ASEO', grupos: [{ t: 'Lo que se saca', items: itemsB }] });

  const sumaMuros = (lista, mat) => lista.filter((m) => m.mat === mat).reduce((s, m) => s + geo(m).L * m.alto - vanosDe(m).reduce((a, v) => a + v.ancho * v.alto, 0), 0);
  const mezclaRelleno = P.param.relleno;
  for (const r of recs) {
    const propios = P.muros.filter((m) => dueno.get(m.id) === r.id);
    const nuevos = propios.filter((m) => m.estado === 'nuevo');
    const borde = P.muros.filter((m) => m.estado !== 'demoler' && enBorde(m, r) > 0);
    const A = area(r), per = 2 * (r.w + r.d);
    const altos = borde.map((m) => m.alto).sort((a, b) => a - b);
    const hInt = Math.min(altos.length ? altos[Math.floor(altos.length / 2)] : P.param.alturaMuro, 3.2);
    const vanosBorde = [], vanosPropios = [];
    for (const m of borde) for (const v of vanosDe(m)) {
      const [vx, vy] = posVano(v);
      if (vx >= r.x - 0.4 && vx <= r.x + r.w + 0.4 && vy >= r.y - 0.4 && vy <= r.y + r.d + 0.4) { vanosBorde.push(v); if (dueno.get(m.id) === r.id) vanosPropios.push(v); }
    }
    const og = [];
    const fund = nuevos.filter((m) => m.mat !== 'tabique').reduce((s, m) => s + geo(m).L, 0);
    if (fund) og.push(it('fund', 'Fundaciones y sobrecimientos', 'ml', fund, 'Plano'));
    if (r.tipo === 'nueva' || r.retiroPiso) {
      og.push(mezclaRelleno ? it('relleno', `Relleno compactado bajo radier (e = ${n2(mezclaRelleno)} m)`, 'm³', A * mezclaRelleno, 'Supuesto')
        : it('relleno', 'Relleno compactado bajo radier (falta el espesor)', 'm³', null, 'Pendiente'));
      og.push(it('radier', 'Radier', 'm²', A, 'Plano'));
    }
    const alb = sumaMuros(nuevos, 'albanileria'), hor = sumaMuros(nuevos, 'hormigon'), tab = sumaMuros(nuevos, 'tabique');
    if (alb) og.push(it('alb', 'Muros de albañilería (descontados los vanos)', 'm²', alb, 'Plano'));
    if (hor) og.push(it('horm', 'Muros de hormigón armado (descontados los vanos)', 'm²', hor, 'Plano'));
    if (tab) og.push(it('tab', 'Tabiques de volcanita (descontados los vanos)', 'm²', tab, 'Plano'));
    if (r.techo) { const a = P.param.alero; og.push(it('techo', `Techumbre con alero de ${n2(a)} m`, 'm²', (r.w + 2 * a) * (r.d + 2 * a), 'Supuesto')); }
    const te = [];
    const pv = r.piso === 'Por confirmar' ? '(material por confirmar)' : r.piso.toLowerCase();
    te.push(it('pav:' + r.piso, `Pavimento ${pv}`, 'm²', A, r.piso === 'Por confirmar' ? 'Supuesto' : 'Plano'));
    const puertasB = vanosBorde.filter((v) => v.tipo === 'puerta');
    const vanArea = vanosBorde.reduce((s, v) => s + v.ancho * Math.min(v.alto, hInt), 0);
    const esBano = r.uso === 'bano';
    if (!esBano && r.uso !== 'pasillo') te.push(it('guard', 'Guardapolvo', 'ml', per - puertasB.reduce((s, v) => s + v.ancho, 0), 'Plano'));
    if (r.cielo !== 'Sin cielo' && r.uso !== 'pasillo') {
      const cv = r.cielo === 'Por confirmar' ? '(material por confirmar)' : r.cielo.toLowerCase();
      te.push(it('cielo:' + r.cielo, `Cielo ${cv}`, 'm²', A, r.cielo === 'Por confirmar' ? 'Supuesto' : 'Plano'));
      te.push(it('pint_c', 'Pintura de cielo', 'm²', A, 'Plano'));
    }

      else te.push(it('pint_m', `Pintura de muros (h = ${n2(hInt)} m)`, 'm²', per * hInt - vanArea, 'Plano'));
    }
    const porAncho = {};
    for (const v of vanosPropios) {
      const k = v.tipo === 'puerta' ? `puerta:${v.ancho.toFixed(2)}` : `ventana:${v.ancho.toFixed(2)}x${v.alto.toFixed(2)}`;
      porAncho[k] = (porAncho[k] || 0) + 1;
    }

      const [tipo, med] = k.split(':');

      te.push(it(k, desc, 'un', c, 'Plano'));
    }
    const ins = [];
    const objs = P.objetos.filter((o) => dentro(o, r) && o.tipo !== 'pilar' && OBJ[o.tipo]?.grupo !== 'Mobiliario');

    for (const [t, c] of Object.entries(cuenta)) ins.push(it('obj:' + t, OBJ[t].n, 'un', c, 'Plano'));
    if (!cuenta.luminaria && !cuenta.enchufe && r.uso !== 'pasillo') ins.push(it('elec_gl', 'Instalación eléctrica e iluminación', 'gl', 1, 'Global'));
    if (esBano && !cuenta.agua && (cuenta.wc || cuenta.lavamanos)) ins.push(it('sanit_gl', 'Instalación sanitaria: agua y desagüe', 'gl', 1, 'Global'));
    const grupos = [];
    if (og.length) grupos.push({ t: 'Obra gruesa', items: og });
    grupos.push({ t: 'Terminaciones', items: te });
    if (ins.length) grupos.push({ t: 'Instalaciones y artefactos', items: ins });
    secciones.push({ titulo: `${r.nombre.toUpperCase()} (${r.tipo === 'nueva' ? 'OBRA NUEVA' : 'REMODELACIÓN'})`, recinto: r.id, grupos });
  }
  // Lo que no es de ningún recinto
  const sueltos = P.muros.filter((m) => m.estado === 'nuevo' && !dueno.has(m.id));
  const ext = [];
  const fl = sueltos.filter((m) => m.mat !== 'tabique').reduce((s, m) => s + geo(m).L, 0);
  if (fl) ext.push(it('fund', 'Fundaciones y sobrecimientos', 'ml', fl, 'Plano'));
  const al = sumaMuros(sueltos, 'albanileria'), ho = sumaMuros(sueltos, 'hormigon'), ta = sumaMuros(sueltos, 'tabique');
  if (al) ext.push(it('alb', 'Muros de albañilería (descontados los vanos)', 'm²', al, 'Plano'));
  if (ho) ext.push(it('horm', 'Muros de hormigón armado (descontados los vanos)', 'm²', ho, 'Plano'));
  if (ta) ext.push(it('tab', 'Tabiques de volcanita (descontados los vanos)', 'm²', ta, 'Plano'));
  const fuera = P.objetos.filter((o) => !recs.some((r) => dentro(o, r)));
  const cf = {}; for (const o of fuera) cf[o.tipo] = (cf[o.tipo] || 0) + 1;
  for (const [t, c] of Object.entries(cf)) if (OBJ[t] && OBJ[t].grupo !== 'Mobiliario') ext.push(it('obj:' + t, OBJ[t].n, 'un', c, 'Plano'));
  ext.push(it('red_agua', 'Red de agua potable y empalme definitivo', 'gl', 1, 'Global'));
  ext.push(it('red_alc', 'Red de alcantarillado y unión domiciliaria', 'gl', 1, 'Global'));
  ext.push(it('tablero_gral', 'Tablero general y empalme eléctrico definitivo', 'gl', 1, 'Global'));
  secciones.push({ titulo: 'EXTERIORES, DESLINDES E INSTALACIONES GENERALES', grupos: [{ t: 'Fuera de los recintos', items: ext }] });
  // letras y totales
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let cd = 0;
  const estados = {};
  secciones.forEach((s, i) => {
    s.letra = i < 26 ? L[i] : 'A' + L[i - 26];
    s.total = 0;
    s.grupos.forEach((g, gi) => g.items.forEach((x, ii) => {
      x.cod = `${gi + 1}.${ii + 1}`;
      x.precio = P.precios[x.clave] ?? null;
      x.total = x.q != null && x.precio != null ? x.q * x.precio : null;
      s.total += x.total || 0;
      estados[x.estado] = (estados[x.estado] || 0) + 1;
    }));
    cd += s.total;
  });
  const gg = cd * P.param.gg / 100, ut = cd * P.param.util / 100, neto = cd + gg + ut, iva = neto * P.param.iva / 100;
  const nItems = secciones.reduce((s, x) => s + x.grupos.reduce((a, g) => a + g.items.length, 0), 0);
  const conPrecio = secciones.reduce((s, x) => s + x.grupos.reduce((a, g) => a + g.items.filter((i) => i.precio != null).length, 0), 0);
  return { secciones, cd, gg, ut, neto, iva, total: neto + iva, estados, nItems, conPrecio };
}

function caja(w, h, d, mat, eu = 0.6, ev = 0.32) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];

  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m;
}

  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / rep, uv.getY(i) * d / rep);
  const m = new THREE.Mesh(g, mat); m.rotation.x = -Math.PI / 2; m.position.set(X(x + w / 2), z, Z(y + d / 2)); m.receiveShadow = true; return m;
}
// Caja a lo largo de un muro, entre s0 y s1 y de z0 a z1
function cajaMuro(m, s0, s1, z0, z1, mat, extender) {

// ================================================================== estado de vista
let vista = '3d', etapa = 5, sinTecho = false, rx = false;

    obra.add(suelo(L.x0, L.y0, L.x1 - L.x0, L.y1 - L.y0, 0, etapa >= 5 ? M.pasto : M.tierra, 3));
  }
  // borde del lote (línea segmentada)
  const pts = [[L.x0, L.y0], [L.x1, L.y0], [L.x1, L.y1], [L.x0, L.y1], [L.x0, L.y0]].map(([x, y]) => new THREE.Vector3(X(x), 0.03, Z(y)));
  const lin = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: plantaV ? 0x444444 : 0xffffff, dashSize: 0.6, gapSize: 0.4 }));
  lin.computeLineDistances(); obra.add(lin);
  // recintos: radier y pavimento, más la superficie tocable
  for (const r of P.recintos) {
    if (plantaV) {
      const f = suelo(r.x, r.y, r.w, r.d, 0.01, new THREE.MeshBasicMaterial({ color: r.tipo === 'nueva' ? 0xfbe9e6 : 0xebecea }));
      obra.add(f);
    } else {
      if (r.tipo === 'nueva' || r.retiroPiso) { if (visibleDesde(2, 4)) obra.add(suelo(r.x, r.y, r.w, r.d, 0.1, M.radier, 2)); }
      else if (visibleDesde(1, 4)) obra.add(suelo(r.x, r.y, r.w, r.d, 0.1, M.existente, 2));
      if (visibleDesde(5)) obra.add(suelo(r.x, r.y, r.w, r.d, 0.12, matPiso[r.piso] || matPiso['Por confirmar'], 1.5));
      if (r.techo && visibleDesde(4) && !sinTecho) {
        const a = P.param.alero;
        const hT = Math.max(...P.muros.filter((m) => enBorde(m, r) > 0).map((m) => m.alto), P.param.alturaMuro);
        const t = caja(r.w + 2 * a, 0.1, r.d + 2 * a, M.zinc, 0.25, 4);
        t.position.set(X(r.x + r.w / 2), hT + 0.06, Z(r.y + r.d / 2)); t.userData.techo = true; obra.add(t);
      }

    const p = suelo(r.x, r.y, r.w, r.d, 0.2, new THREE.MeshBasicMaterial({ color: 0xc8372d, transparent: true, opacity: 0.22, depthWrite: false }));
    p.material.visible = selec?.kind === 'recinto' && selec.id === r.id; p.userData = { kind: 'recinto', id: r.id }; p.renderOrder = 3;
    obra.add(p); pickRecintos.push(p);
  }

    else if (m.estado === 'demoler') { if (!visibleDesde(1, 1)) continue; mat = M.demoler; }

      if (!visibleDesde(3)) continue;
      mat = etapa >= 5 ? M.pintado : M[m.mat];
    }
    const piezas = plantaV ? [[0, geo(m).L, 0, m.alto]] : tramos(m);
    for (const [s0, s1, z0, z1] of piezas) {
      const k = cajaMuro(m, s0, s1, Math.max(z0, m.estado === 'nuevo' && !plantaV ? 0.2 : 0), z1, mat, true);
      k.userData = { kind: 'muro', id: m.id }; obra.add(k); pickMuros.push(k);

      const a = v.s - v.ancho / 2, b = v.s + v.ancho / 2;

        k.scale.z = v.tipo === 'ventana' ? 0.45 : 1.02; k.userData = { kind: 'vano', id: v.id }; obra.add(k); pickVanos.push(k);

        k.userData = { kind: 'vano', id: v.id }; obra.add(k); pickVanos.push(k);
        for (const s of [a, (a + b) / 2, b - 0.05]) { const f = cajaMuro(m, s, s + 0.05, v.antepecho, v.antepecho + v.alto, M.marco, false); obra.add(f); }
      } else {
        const k = cajaMuro(m, a + 0.03, b - 0.03, 0.12, v.alto - 0.02, M.puerta, false); k.scale.z = 0.3;
        k.userData = { kind: 'vano', id: v.id }; obra.add(k); pickVanos.push(k);
      }
    }
  }
  // objetos
  for (const o of P.objetos) {
    const d = OBJ[o.tipo]; if (!d) continue;
    const inst = !!(d.red || d.hub);
    if (!plantaV) {
      if (o.tipo === 'pilar') { if (!visibleDesde(3)) continue; }
      else if (inst) { if (!(rx || etapa === 4 || etapa === 5)) continue; if (etapa < 4 && !rx) continue; }

    if (plantaV) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(k.geometry), new THREE.LineBasicMaterial({ color: 0x22282b })); k.add(e); }

}

// Redes automáticas: cada punto se une al medidor, la cámara o el tablero más cercano (recorrido en L)
function redes() {
  const COL = { agua: 0x2f8fe0, desague: 0x7a4419, elec: 0xf2b705 };
  const Z0 = { agua: -0.35, desague: -0.6, elec: P.param.alturaMuro - 0.1 };
  for (const red of ['agua', 'desague', 'elec']) {
    const hubs = P.objetos.filter((o) => OBJ[o.tipo]?.hub === red);
    const puntos = P.objetos.filter((o) => OBJ[o.tipo]?.red === red || (red !== 'elec' && ['wc', 'lavamanos', 'urinario', 'ducha', 'lavaplatos'].includes(o.tipo)));
    if (!hubs.length) continue;
    const mat = new THREE.MeshStandardMaterial({ color: COL[red], emissive: COL[red], emissiveIntensity: 0.25 });
    const rad = red === 'desague' ? 0.06 : red === 'agua' ? 0.035 : 0.022;
    for (const p of puntos) {
      const h = hubs.reduce((a, b) => (Math.hypot(b.x - p.x, b.y - p.y) < Math.hypot(a.x - p.x, a.y - p.y) ? b : a));
      const z = Z0[red], zp = red === 'elec' ? z : (OBJ[p.tipo].base || 0.1);
      const ruta = [[p.x, p.y, zp], [p.x, p.y, z], [h.x, p.y, z], [h.x, h.y, z]];
      for (let i = 0; i < ruta.length - 1; i++) {
        const a = new THREE.Vector3(X(ruta[i][0]), ruta[i][2], Z(ruta[i][1])), b = new THREE.Vector3(X(ruta[i + 1][0]), ruta[i + 1][2], Z(ruta[i + 1][1]));
        const Lr = a.distanceTo(b); if (Lr < 0.01) continue;
        const c = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, Lr, 8), mat);
        c.position.copy(a).add(b).multiplyScalar(0.5); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
        obra.add(c);
      }
    }
  }
}

const LAT = -33.5 * Math.PI / 180, LON = -70.65;
function posicionSol() {
  const hora = +$('hora').value, mes = new Date().getMonth(), n = Math.round(mes * 30.44 + 15), utc = (mes >= 3 && mes <= 7) ? -4 : -3;
  const B = 2 * Math.PI * (n - 81) / 364, eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const Hh = ((hora + (LON - utc * 15) / 15 + eot / 60) - 12) * 15 * Math.PI / 180;
  const dec = 23.44 * Math.PI / 180 * Math.sin(2 * Math.PI * (284 + n) / 365);
  const alt = Math.asin(Math.sin(LAT) * Math.sin(dec) + Math.cos(LAT) * Math.cos(dec) * Math.cos(Hh));
  const az = Math.atan2(Math.sin(Hh), Math.cos(Hh) * Math.sin(LAT) - Math.tan(dec) * Math.cos(LAT)) + Math.PI;
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(alt), Math.sin(alt), -Math.cos(az) * Math.cos(alt));
  sol.position.copy(dir.multiplyScalar(80));
  const s = Math.max(0, Math.sin(alt)), dia = Math.min(1, Math.max(0, (alt * 180 / Math.PI + 4) / 14));
  sol.intensity = 2.4 * Math.min(1, s * 3); hemi.intensity = 0.15 + 0.5 * dia;
  const c = new THREE.Color(0x0c1420).lerp(new THREE.Color(0xe9a97a), dia).lerp(new THREE.Color(0xa9c9e2), Math.min(1, s * 2.2));
  scene.background = vista === 'planta' ? new THREE.Color(0xf4f3ef) : c;
  const hh = Math.floor(hora), mm = Math.round((hora - hh) * 60);
  $('hora-v').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
$('hora').addEventListener('input', posicionSol);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), planoSuelo = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), tmp = new THREE.Vector3();

}

  } else if (selec.kind === 'obj') {
    const o = P.objetos.find((x) => x.id === selec.id); if (!o) return; const d = OBJ[o.tipo];
    const r = P.recintos.find((rr) => dentro(o, rr));
    cp.innerHTML = `<h2>${esc(d.n)}</h2><div class="lectura"><span class="chip tot">${esc(d.grupo)}</span><span class="chip tot">${r ? esc(r.nombre) : 'fuera de los recintos'}</span></div>
      <div class="campos"><label>X (m) ${num('f-ox', o.x, 0.05)}</label><label>Y (m) ${num('f-oy', o.y, 0.05)}</label><label>Giro ${sel('f-rot', { 0: '0°', 90: '90°', 180: '180°', 270: '270°' }, String(o.rot || 0))}</label></div>
      <p class="nota">Arrástralo con la herramienta Elegir para moverlo. R lo gira.</p><div class="acciones"><button class="btn peligro" id="f-borrar">Borrar</button></div>`;

function enlazar(mapa) {
  for (const [id, fn] of Object.entries(mapa)) {

    el.addEventListener('change', () => {
      const antes = JSON.stringify(P);

      hist.push(antes); if (hist.length > 80) hist.shift(); rehist.length = 0;
      tocar();

  }
}

// ---------------------------------------------------------------- Excel en el formato de Luciano
async function exportarExcel() {
  if (!window.XLSX) { aviso('No cargó la librería de Excel. Revisa la conexión y vuelve a intentar.'); return; }
  const c = cubicar(), filas = [], celdas = {};
  const enc = (r, col) => XLSX.utils.encode_cell({ r, c: col });
  filas.push(['PRESUPUESTO DESGLOSADO POR ITEMS A SUMA ALZADA']);
  filas.push([]); filas.push([`OBRA: ${P.nombre.toUpperCase()}`]); filas.push([`DIRECCIÓN: ${P.direccion}`]);
  filas.push([`Cubicación desde la maqueta · ${new Date().toLocaleDateString('es-CL')}`]); filas.push([]);
  const totales = [];
  for (const s of c.secciones) {
    filas.push([s.letra, s.titulo, 'Unidad', 'Cantidad', 'P. Unitario', 'Total', '', 'Estado']);
    const ini = filas.length;
    s.grupos.forEach((g, gi) => {
      filas.push([gi + 1, g.t]);
      for (const i of g.items) {
        const r = filas.length;
        filas.push([i.cod, i.desc, i.un, i.q, i.precio, null, '', i.estado]);
        celdas[enc(r, 5)] = { f: `D${r + 1}*E${r + 1}`, v: i.total || 0 };
      }
    });
    const rt = filas.length;
    filas.push(['', `TOTAL ${s.letra}`, '', '', '', null]);
    celdas[enc(rt, 5)] = { f: `SUM(F${ini + 1}:F${rt})`, v: s.total };
    totales.push([s.letra, s.titulo, rt + 1, s.total]);
    filas.push([]);
  }
  filas.push(['', 'RESUMEN']);
  const r0 = filas.length;
  for (const [l, t, r, v] of totales) { celdas[enc(filas.length, 5)] = { f: `F${r}`, v }; filas.push([l, t, '', '', '', null]); }
  const rcd = filas.length; celdas[enc(rcd, 5)] = { f: `SUM(F${r0 + 1}:F${rcd})`, v: c.cd }; filas.push(['', 'COSTO DIRECTO', '', '', '', null]);
  const rgg = filas.length; celdas[enc(rgg, 5)] = { f: `F${rcd + 1}*${P.param.gg / 100}`, v: c.gg }; filas.push(['', `GASTOS GENERALES ${P.param.gg}%`, '', '', '', null]);
  const rut = filas.length; celdas[enc(rut, 5)] = { f: `F${rcd + 1}*${P.param.util / 100}`, v: c.ut }; filas.push(['', `UTILIDADES ${P.param.util}%`, '', '', '', null]);
  const rne = filas.length; celdas[enc(rne, 5)] = { f: `SUM(F${rcd + 1}:F${rut + 1})`, v: c.neto }; filas.push(['', 'NETO', '', '', '', null]);
  const riv = filas.length; celdas[enc(riv, 5)] = { f: `F${rne + 1}*${P.param.iva / 100}`, v: c.iva }; filas.push(['', `IVA ${P.param.iva}%`, '', '', '', null]);
  const rto = filas.length; celdas[enc(rto, 5)] = { f: `F${rne + 1}+F${riv + 1}`, v: c.total }; filas.push(['', 'TOTAL', '', '', '', null]);
  const ws = XLSX.utils.aoa_to_sheet(filas);
  for (const [ref, v] of Object.entries(celdas)) ws[ref] = { t: 'n', f: v.f, v: v.v, z: '#,##0' };
  ws['!cols'] = [{ wch: 6 }, { wch: 58 }, { wch: 8 }, { wch: 11 }, { wch: 12 }, { wch: 14 }, { wch: 2 }, { wch: 11 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Presupuesto');
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const nombre = `Presupuesto ${P.nombre}.xlsx`.replace(/[\\/:*?"<>|]/g, '');
  await guardarArchivo(nombre, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
async function guardarArchivo(nombre, blob) {
  const dl = await usar('downloads');
  if (!dl) { aviso('Este visor no permite descargar archivos.'); return; }
  try { await dl.save({ filename: nombre, data: blob }); aviso('Archivo listo.'); }
  catch (e) { if (e?.code !== 'declined') aviso(e?.code === 'rate_limited' ? 'Ya hay una descarga esperando tu confirmación.' : 'No se pudo descargar el archivo.'); }
}

// ================================================================== guardado: compartido si se puede, si no en este navegador
const usar = async (n) => { try { return window.claude?.use ? await window.claude.use(n) : null; } catch { return null; } };
let db = null, modo = 'local', escribible = true, quitarEscucha = null, ultimoGuardado = 0, timerGuardar = null, proyectos = [];
const LS = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } } };
function pintarCabecera() { $('p-nombre').textContent = P.nombre; $('p-dir').textContent = P.direccion || 'Proyecto'; }
function estadoGuardado(t, cls) { const g = $('guardado'); g.textContent = t; g.className = 'estado-guardado ' + cls; }
function programarGuardado() {
  estadoGuardado('Sin guardar', 'pend');
  clearTimeout(timerGuardar); timerGuardar = setTimeout(guardar, 1200);
}
async function guardar() {
  timerGuardar = null;
  if (!pid) pid = nid('p');
  const doc = { nombre: P.nombre, actualizado: Date.now(), modelo: P };
  ultimoGuardado = doc.actualizado;
  if (modo === 'compartido' && escribible) {
    try { await db.collection('proyectos').doc(pid).set(doc); estadoGuardado('Guardado para todos', 'ok'); return; }
    catch (e) {
      if (e?.code === 'invalid_argument' && JSON.stringify(doc).length < 250000) { escribible = false; aviso('No tienes permiso para guardar en la página. Guardo en este navegador.'); }
      else if (e?.code === 'quota_exceeded') { aviso('La página llegó a su límite de datos. Borra proyectos que no uses.'); }
    }
  }
  const lista = LS.get('maqueta:lista') || [];
  const i = lista.findIndex((x) => x.id === pid); const meta = { id: pid, nombre: P.nombre, actualizado: doc.actualizado };
  if (i >= 0) lista[i] = meta; else lista.unshift(meta);
  if (LS.set('maqueta:p:' + pid, P) && LS.set('maqueta:lista', lista)) estadoGuardado('Guardado en este navegador', 'local');
  else estadoGuardado('No se pudo guardar: descarga el archivo .json', 'pend');
  if (modo === 'local' || !escribible) { proyectos = lista.map((x) => ({ ...x, local: true })); pintarProyectos(); }
}
function abrir(id, modelo) {
  pid = id; P = clon(modelo); hist.length = rehist.length = 0; selec = null; trazo = null;
  escuchar(); pintarCabecera(); encuadre(); tocar(false); estadoGuardado(id ? (modo === 'compartido' && escribible ? 'Guardado para todos' : 'Guardado en este navegador') : 'Sin guardar todavía', id ? (modo === 'compartido' && escribible ? 'ok' : 'local') : 'pend');
  pintarProyectos();
}
function escuchar() {
  if (quitarEscucha) { quitarEscucha(); quitarEscucha = null; }
  if (!db || !pid || modo !== 'compartido') return;
  quitarEscucha = db.collection('proyectos').doc(pid).onSnapshot((s) => {
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const d = s.data();
    if (d.actualizado > ultimoGuardado && !timerGuardar) { ultimoGuardado = d.actualizado; P = clon(d.modelo); validarSeleccion(); tocar(false); pintarCabecera(); aviso('Otra persona actualizó este proyecto.'); }
  }, () => {});
}
async function iniciarGuardado() {
  db = await usar('db');
  const u = await usar('user');
  if (db) {
    const puede = u ? await u.can('data.write') : null;
    modo = 'compartido'; escribible = puede !== false;
    db.collection('proyectos').onSnapshot((s) => {
      proyectos = s.docs.map((d) => ({ id: d.id, nombre: d.data().nombre, actualizado: d.data().actualizado, modelo: d.data().modelo })).sort((a, b) => b.actualizado - a.actualizado);
      const locales = (LS.get('maqueta:lista') || []).map((x) => ({ ...x, local: true }));
      if (!escribible) proyectos = proyectos.concat(locales);
      pintarProyectos();
      if (!pid && !hist.length && proyectos.length) { const p = proyectos[0]; abrir(p.id, p.modelo || LS.get('maqueta:p:' + p.id)); }
    }, () => {});
  } else {
    modo = 'local';
    proyectos = (LS.get('maqueta:lista') || []).map((x) => ({ ...x, local: true }));
    pintarProyectos();
    if (proyectos.length && !hist.length) { const m = LS.get('maqueta:p:' + proyectos[0].id); if (m) abrir(proyectos[0].id, m); }
  }
  $('modo-guardado').textContent = modo === 'compartido' && escribible ? 'Los proyectos se guardan en la página: todos los que tienen acceso ven los mismos.'
    : modo === 'compartido' ? 'Puedes ver los proyectos de la página, pero no guardar en ella. Lo tuyo queda en este navegador; pásalo con el archivo .json.'
    : 'Los proyectos quedan en este navegador. Para pasarlos a otra persona, guarda el archivo .json.';
}
function pintarProyectos() {
  const l = $('lista-proy');
  l.innerHTML = proyectos.length ? proyectos.map((p) => `<li><button data-id="${esc(p.id)}" aria-current="${p.id === pid}"><b>${esc(p.nombre)}</b><small>${p.local ? 'en este navegador · ' : ''}${new Date(p.actualizado).toLocaleString('es-CL', { dateStyle: 'short', timeStyle: 'short' })}</small></button></li>`).join('')
    : '<li class="vacio">Todavía no hay proyectos guardados. El que tienes abierto se guarda con el primer cambio.</li>';
  if (pid) l.insertAdjacentHTML('beforeend', `<li><div class="acciones"><button class="btn" id="b-duplicar">Duplicar el abierto</button><button class="btn peligro" id="b-eliminar">Eliminar el abierto</button></div></li>`);
  $('b-duplicar')?.addEventListener('click', () => { const m = clon(P); m.nombre += ' (copia)'; abrir(null, m); guardar(); $('cajon').hidden = true; });
  $('b-eliminar')?.addEventListener('click', () => confirmar(`¿Eliminar «${P.nombre}»? No se puede deshacer.`, async () => {
    const id = pid;
    if (modo === 'compartido' && escribible) { try { await db.collection('proyectos').doc(id).delete(); } catch { aviso('No se pudo eliminar.'); return; } }
    LS.set('maqueta:lista', (LS.get('maqueta:lista') || []).filter((x) => x.id !== id)); try { localStorage.removeItem('maqueta:p:' + id); } catch {}
    proyectos = proyectos.filter((p) => p.id !== id); abrir(null, PLANTILLA_SAN_MIGUEL);
  }));
}
$('lista-proy').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const p = proyectos.find((x) => x.id === b.dataset.id); if (!p) return;
  const m = p.modelo || LS.get('maqueta:p:' + p.id);
  if (!m) { aviso('No encontré ese proyecto en este navegador.'); return; }
  abrir(p.id, m); $('cajon').hidden = true;
});
$('b-proyectos').addEventListener('click', () => { $('cajon').hidden = !$('cajon').hidden; pintarProyectos(); });
for (const b of document.querySelectorAll('[data-nuevo]')) b.addEventListener('click', () => {
  const m = b.dataset.nuevo === 'vacio' ? proyectoVacio() : clon(PLANTILLA_SAN_MIGUEL);
  if (b.dataset.nuevo === 'sanmiguel') m.nombre = 'Sede San Miguel (copia)';
  abrir(null, m); guardar(); $('cajon').hidden = true;
  if (b.dataset.nuevo === 'vacio') { ponerVista('planta'); elegirHerramienta('muro'); aviso('Terreno de 20 × 30 m. Dibuja el primer muro: clic en cada esquina.'); }
});
$('b-exportar-json').addEventListener('click', () => guardarArchivo(`${P.nombre}.json`.replace(/[\\/:*?"<>|]/g, ''), JSON.stringify(P)));
$('importar').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const m = JSON.parse(await f.text()); if (!Array.isArray(m.muros) || !m.lote) throw 0; abrir(null, m); guardar(); $('cajon').hidden = true; aviso(`Abrí «${m.nombre}».`); }
  catch { aviso('Ese archivo no es un proyecto de la maqueta.'); }
  e.target.value = '';
});
function confirmar(t, fn) {
  $('confirma-t').textContent = t; $('confirma').hidden = false;
  $('confirma-si').onclick = () => { $('confirma').hidden = true; fn(); };
  $('confirma-no').onclick = () => { $('confirma').hidden = true; };
}

// ================================================================== rótulos de recintos
const capaEtiq = $('capa-etiq');
let moverEtiquetasPronto = true;
function moverEtiquetas() {
  const nodos = capaEtiq.children;
  while (nodos.length < P.recintos.length) { const d = document.createElement('div'); capaEtiq.appendChild(d); }
  while (nodos.length > P.recintos.length) capaEtiq.removeChild(capaEtiq.lastChild);
  const orden = P.recintos.map((r, i) => [r, i]).sort((a, b) => area(b[0]) - area(a[0]));
  const puestos = [];
  for (const [r, i] of orden) {
    const d = nodos[i];
    const txt = `${esc(r.nombre)}<small>${n2(area(r))} m²</small>`;
    if (d._t !== txt) { d.innerHTML = txt; d._t = txt; d.className = 'etiqueta' + (r.tipo === 'nueva' ? ' nueva' : ''); }
    tmp.set(X(r.x + r.w / 2), vista === 'planta' ? 4 : 1.2, Z(r.y + r.d / 2)).project(cam);
    let vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
    const x = (tmp.x + 1) / 2 * innerWidth, y = (1 - tmp.y) / 2 * innerHeight;
    if (vis) { const w = d.offsetWidth / 2 + 3, h = d.offsetHeight / 2 + 2, c = [x - w, y - h, x + w, y + h]; if (puestos.some((p) => c[0] < p[2] && c[2] > p[0] && c[1] < p[3] && c[3] > p[1])) vis = false; else puestos.push(c); }
    d.style.display = vis ? '' : 'none';
    if (vis) { d.style.left = x + 'px'; d.style.top = y + 'px'; }
  }
}

// ================================================================== arranque
function pintarBotones() {
  $('b-deshacer').disabled = !hist.length; $('b-rehacer').disabled = !rehist.length;
  for (const b of $('etapas').querySelectorAll('button')) b.setAttribute('aria-pressed', String(+b.dataset.e === etapa));
}
$('b-deshacer').addEventListener('click', deshacer);
$('b-rehacer').addEventListener('click', rehacer);
addEventListener('resize', () => { cam3.aspect = innerWidth / innerHeight; cam3.updateProjectionMatrix(); ajustarOrto(); renderer.setSize(innerWidth, innerHeight); });
pintarCabecera(); configurarControles(); pintarOpciones(); encuadre(); posicionSol(); pintarPanel(); pintarBotones();
estadoGuardado('Plantilla sin guardar', 'pend');
iniciarGuardado();
renderer.setAnimationLoop(() => {
  if (reconstruir) construir();
  if (vista === '3d') ctl3.update(); else ctlP.update();
  moverEtiquetas();
  renderer.render(scene, cam);
});
})();
