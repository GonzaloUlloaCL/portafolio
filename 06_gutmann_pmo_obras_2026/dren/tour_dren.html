  --bg:#121715;--escena:#1b2220;--panel:#1a201e;--fg:#e4eae6;--muted:#97a49d;--line:#2f3934;

:root[data-theme="dark"]{
  --bg:#121715;--escena:#1b2220;--panel:#1a201e;--fg:#e4eae6;--muted:#97a49d;--line:#2f3934;
  --accent:#7cc2dc;--accent-fg:#0b1a20;--obra:#f0a061;--velo:rgba(26,32,30,.86);

*{box-sizing:border-box}

button{font:inherit;color:inherit;cursor:pointer}

#vista{position:fixed;inset:0;background:var(--escena);touch-action:none}
#vista canvas{display:block;width:100%;height:100%}

.cab{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

  .leyenda{left:16px;right:16px;width:auto;max-height:30vh;padding:8px 12px}

  .cap-actual{order:9;flex-basis:100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<header class="cab">

  </div>
</footer>

  const tg = new THREE.Vector3(L(A.t[0], B.t[0]), L(A.t[1], B.t[1]), L(A.t[2], B.t[2]));
  const e = ESC > 1 ? ESC * (c.escMovil || 1) : 1;   // en celular se aleja; el corte del pozo, un poco más por sus rótulos
  const r = L(A.r, B.r) * e, h = L(A.h, B.h) * e, a = L(A.a, B.a) * Math.PI / 180;
  return { pos: tg.clone().add(new THREE.Vector3(r * Math.sin(a), h, r * Math.cos(a))), tg };
}
// lo que se construye en el capítulo: "sube" crece desde su base (o hacia abajo si la base es 0 y el objeto está bajo el
// suelo), "cae" se posa desde arriba, "aparece" se funde desde transparente y "muestra" lo enciende al llegar su turno
const ANIMADOS = [...new Set(CAPS.flatMap(c => (c.anim || []).map(a => a[0])))];
function obra(s) {
  const i = capDe(s), c = CAPS[i], u = Math.min(1, Math.max(0, (s - INI[i]) / (c.dur - LECTURA)));
  ANIMADOS.forEach(g => { G[g].scale.y = 1; G[g].position.y = 0; G[g].traverse(o => { if (o.isMesh && o.userData.funde) { o.material.opacity = 1; o.material.transparent = false; } }); });
  (c.anim || []).forEach(([g, tipo, d, h, base = 0]) => {
    const f = ease(Math.min(1, Math.max(0, (u - d) / (h - d)))), grupo = G[g];
    if (tipo === "cae") { grupo.position.y = 6 * (1 - f); return; }
    if (tipo === "muestra") { grupo.visible = (u - d) > 0; return; }
    if (tipo === "aparece") { grupo.traverse(o => { if (o.isMesh) { o.userData.funde = true; o.material.transparent = true; o.material.opacity = Math.max(0.02, f); } }); return; }
    grupo.scale.y = Math.max(0.001, f); grupo.position.y = base * (1 - grupo.scale.y);
    grupo.visible = f > 0.01;
  });
}
function mostrar(i) {
  const c = CAPS[i];
  Object.keys(G).forEach(g => { G[g].visible = c.ver.includes(g); });
  [matSuelo, matSueloH].forEach(m => { m.transparent = true; m.opacity = c.op; m.depthWrite = c.op === 1; });
  const velo = c.velo || 1;                            // las dos capas de arriba del pozo, traslúcidas para ver el tubo
  S.CAPAS.map((_, j) => j).filter(j => BASES[j] + S.CAPAS[j][1] > -(FC + 0.2)).forEach(j => G["c" + j].traverse(o => { if (o.isMesh) {
    o.material.opacity = velo; o.material.transparent = velo < 1; o.material.depthWrite = velo === 1; } }));
  $("lNum").textContent = "Capítulo " + (i + 1) + " de " + CAPS.length;
  $("lTit").textContent = c.n; $("lTxt").textContent = c.txt; $("capActual").textContent = (i + 1) + ". " + c.n;
  document.querySelectorAll("#tramos button").forEach((b, j) => b.classList.toggle("on", j <= i));
  document.querySelectorAll("#lista > li").forEach((li, j) => li.classList.toggle("on", j === i));
}
function ir(s, dejarManual) {
  t = Math.max(0, Math.min(TOTAL, s));
  if (!dejarManual) { manual = false; mezcla = null; }
  pintar();
}
function pintar() {
  const i = capDe(t);
  if (i !== capAct) { capAct = i; mostrar(i); }
  $("barra").value = Math.round(t / TOTAL * 1000);
  $("tiempo").textContent = fmt(t) + " / " + fmt(TOTAL);
}
function play(v) {
  if (v && t >= TOTAL - 0.01) t = 0;
  jugando = v; $("inicio").hidden = true;
  $("bPlay").textContent = v ? "❚❚" : "▶"; $("bPlay").setAttribute("aria-label", v ? "Pausar" : "Reproducir");
  if (v && manual) { mezcla = { p: camera.position.clone(), g: controls.target.clone(), t0: performance.now() }; manual = false; }
}

// línea de tiempo con un tramo por capítulo
$("tramos").innerHTML = CAPS.map((c, i) => `<button style="--d:${c.dur}" title="${i + 1}. ${esc(c.n)}" aria-label="Ir al capítulo ${i + 1}: ${esc(c.n)}" data-i="${i}"></button>`).join("");
$("tramos").addEventListener("click", e => { const b = e.target.closest("button"); if (b) ir(INI[+b.dataset.i]); });
$("barra").addEventListener("input", e => ir(e.target.value / 1000 * TOTAL));
$("bPlay").onclick = () => play(!jugando);
$("inicio").onclick = () => play(true);
$("bAtras").onclick = () => ir(t - 10);
$("bAnt").onclick = () => { const i = capDe(t); ir(t - INI[i] > 1.5 ? INI[i] : INI[Math.max(0, i - 1)]); };
$("bSig").onclick = () => { const i = capDe(t); if (i < CAPS.length - 1) ir(INI[i + 1]); };
$("bRepetir").onclick = () => { repetir = !repetir; $("bRepetir").setAttribute("aria-pressed", String(repetir)); };
$("bTextos").onclick = () => { const on = document.body.classList.toggle("sin-textos"); $("bTextos").setAttribute("aria-pressed", String(!on)); tam(); };
document.addEventListener("keydown", e => {
  if (e.target.closest("input,button,summary") && e.key === " ") return;
  if (e.key === " ") { e.preventDefault(); play(!jugando); }
  else if (e.key === "ArrowLeft") ir(t - 5);
  else if (e.key === "ArrowRight") ir(t + 5);
});

// lista de capítulos con lo que incluye cada uno
$("lista").innerHTML = CAPS.map((c, i) => {
  const inc = (INCLUYE && INCLUYE[i]) || [];
  return `<li><button class="ir" data-i="${i}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span class="t">${esc(c.n)}</span><span class="d">${fmt(c.dur)}</span></button>
    ${inc.length ? `<details><summary>Qué incluye</summary><ul>${inc.map(d => `<li>${esc(d)}</li>`).join("")}</ul></details>` : ""}</li>`;
}).join("");
$("lista").addEventListener("click", e => {
  const b = e.target.closest(".ir"); if (!b) return;
  ir(INI[+b.dataset.i]);
  if (window.innerWidth < 900) abrirCaps(false);
});
function abrirCaps(v) { $("caps").hidden = !v; $("bCaps").setAttribute("aria-expanded", String(v)); }
$("bCaps").onclick = () => abrirCaps($("caps").hidden);
$("cCerrar").onclick = () => abrirCaps(false);

// girar el modelo a mano pausa la película; al reanudar, la cámara vuelve suave al recorrido
controls.addEventListener("start", () => { manual = true; if (jugando) play(false); });

// tocar una pieza muestra su nombre
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let abajo = null, tTip;
renderer.domElement.addEventListener("pointerdown", e => abajo = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!abajo || Math.hypot(e.clientX - abajo[0], e.clientY - abajo[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const vis = o => { for (let n = o; n; n = n.parent) if (!n.visible) return false; return true; };
  const h = ray.intersectObjects(picables.filter(vis))[0], tip = $("tip");
  if (!h || !h.object.userData.titulo) { tip.hidden = true; return; }
  tip.textContent = h.object.userData.titulo.replace(/\s*\([A-D]\.\d+\.\d+\)/g, "");
  tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 12) + "px"; tip.style.top = Math.max(70, e.clientY - 40) + "px";
  tip.hidden = false; clearTimeout(tTip); tTip = setTimeout(() => tip.hidden = true, 3000);
});

// en pantallas angostas (celular vertical) la cámara se aleja según el ancho útil que deja el texto
let ESC = 1;
function tam() {
  // escritorio: texto a la izquierda y la obra corrida a la derecha. Celular (angosto): texto en una franja sobre el
  // reproductor, la obra centrada en el espacio libre de arriba y la cámara más lejos según lo angosta que es la pantalla
  const W = window.innerWidth, H = window.innerHeight, movil = W <= 640, sinTxt = document.body.classList.contains("sin-textos");
  const cab = document.querySelector(".cab").getBoundingClientRect().bottom, ley = $("leyenda");
  if (movil) { ley.style.top = "auto"; ley.style.bottom = (H - document.querySelector(".player").getBoundingClientRect().top + 8) + "px"; }
  else { ley.style.bottom = ""; ley.style.top = cab + 12 + "px"; }   // bajo el encabezado, aunque ocupe dos líneas
  const r = ley.getBoundingClientRect();
  let dx = 0, dy = 0;
  if (!sinTxt && !movil) dx = -(r.right / 2);
  if (!sinTxt && movil) dy = H / 2 - (cab + r.top) / 2;
  else if (movil) dy = H / 2 - (cab + document.querySelector(".player").getBoundingClientRect().top) / 2;
  ESC = movil ? Math.min(2.2, Math.max(1, Math.pow(1.6 / (W / H), 0.6))) : 1;
  renderer.setSize(W, H); camera.aspect = W / H; camera.setViewOffset(W, H, dx, dy, W, H); camera.updateProjectionMatrix();
}
window.addEventListener("resize", tam);

let previo = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.1, (ahora - previo) / 1000); previo = ahora;
  if (jugando) {
    t += dt;
    const i = capDe(Math.min(t, TOTAL - 1e-6));
    if (repetir && t >= INI[i] + CAPS[i].dur - 0.02) t = INI[i];
    if (t >= TOTAL) { t = TOTAL; play(false); }
    pintar();
  }
  if (!manual) {
    const c = camara(Math.min(t, TOTAL - 1e-6));
    if (mezcla) {
      const f = ease(Math.min(1, (ahora - mezcla.t0) / 900));
      camera.position.lerpVectors(mezcla.p, c.pos, f); controls.target.lerpVectors(mezcla.g, c.tg, f);
      if (f >= 1) mezcla = null;
    } else { camera.position.copy(c.pos); controls.target.copy(c.tg); }
  }
  obra(Math.min(t, TOTAL - 1e-6));
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(bucle);
}
tam(); ir(0); requestAnimationFrame(bucle);
</script>
