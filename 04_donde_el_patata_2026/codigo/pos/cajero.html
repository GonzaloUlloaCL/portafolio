// Texto "cuadrada / sobran X / faltan X" reusado en efectivo y en cada metodo (03-jul).
function textoDiferencia(dif){
  return dif===0 ? 'cuadrada ✓' : (dif>0 ? `sobran ${pesos(dif)}` : `faltan ${pesos(-dif)}`);
}
// Filas de "X confirmado" + "Diferencia X" para cada metodo NO efectivo que ya tenga
// un contado_otros guardado (se usan en la pantalla de "caja cerrada" y en el historial).
function filasContadoOtros(res){
  const otros = res.contado_otros||{}, desc = res.descuadre_otros||{};
  return Object.entries(otros).map(([m,v])=>`
    <tr><td>${m} confirmado</td><td style="text-align:right">${pesos(v)}</td></tr>
    <tr><td><b>Diferencia ${m}</b></td><td style="text-align:right"><b>${textoDiferencia(desc[m]||0)}</b></td></tr>`).join('');
}
function mostrarPantallaConteo(r){
  // Ajuste por metodo (punto E2, 03-jul): tarjeta/transferencia no se cuentan fisico,
  // pero se pueden confirmar contra el resumen del posnet o la cartola bancaria, igual
  // que el efectivo se confirma contra el conteo fisico. Solo se muestran los metodos
  // que SI tuvieron venta en el periodo ("cuando existan", pedido de Gonza).
  const otros = Object.entries(r.por_metodo||{}).filter(([k,v])=>k!=='efectivo' && v>0);
  window._metodosOtrosCierre = otros.map(([m])=>m);   // orden fijo para leer los inputs al confirmar
  const inputsOtros = otros.map(([m,v],i)=>`
    <div class="lbl">${m} confirmado (contra posnet / cartola) — vendido: ${pesos(v)}</div>
    <input id="contadoOtro_${i}" type="number" min="0" value="${v}" class="big-input" style="margin-bottom:2px"
      oninput="calcDescuadreOtro(${i},${v})">
    <div id="descuadreOtro_${i}" class="descuadre" style="font-size:14px;margin:2px 0 10px"></div>`).join('');
  $('#modalBody').innerHTML = `<h3>Cerrar caja #${r.caja_id}</h3>
    ${resumenHTML(r)}
    ${inputsOtros}
    <div class="lbl">Efectivo contado en caja</div>
    <input id="contadoInput" type="number" min="0" value="${r.esperado_efectivo}" class="big-input"
      oninput="calcDescuadre(${r.esperado_efectivo})">
    <div id="descuadre" class="descuadre"></div>
    <button class="btn primary" onclick="cerrarCaja()">Confirmar cierre</button>
    <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>`;
  calcDescuadre(r.esperado_efectivo);
  otros.forEach(([m,v],i)=>calcDescuadreOtro(i,v));
  abrirModal();
}
function calcDescuadre(esperado){
  const c=+$('#contadoInput').value||0, d=c-esperado, el=$('#descuadre'); if(!el) return;
  if(d===0) el.innerHTML=`<span class="ok">✓ Caja cuadrada</span>`;
  else if(d>0) el.innerHTML=`<span class="warn">Sobran ${pesos(d)}</span>`;
  else el.innerHTML=`<span class="bad">Faltan ${pesos(-d)}</span>`;
}
function calcDescuadreOtro(i, esperado){
  const c=+$('#contadoOtro_'+i).value||0, d=c-esperado, el=$('#descuadreOtro_'+i); if(!el) return;
  if(d===0) el.innerHTML=`<span class="ok">✓ Cuadra</span>`;
  else if(d>0) el.innerHTML=`<span class="warn">Sobran ${pesos(d)}</span>`;
  else el.innerHTML=`<span class="bad">Faltan ${pesos(-d)}</span>`;
}
async function cerrarCaja(){
  const contado=+$('#contadoInput').value||0;
  const contado_otros={};
  (window._metodosOtrosCierre||[]).forEach((m,i)=>{ contado_otros[m]=+$('#contadoOtro_'+i).value||0; });
  const r=await fetch('/api/caja/cerrar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contado_cierre:contado, contado_otros})});
  if(!r.ok){ const e=await r.json(); toast('Error: '+(e.detail||'')); return; }
  const res=await r.json();
  const dif = textoDiferencia(res.descuadre||0);
  CAJA=null; renderCajaHdr({abierta:false});
  $('#modalBody').innerHTML = `<h3>Caja #${res.caja_id} cerrada</h3>
    ${resumenHTML(res)}
    <table class="tabla">
      <tr><td>Efectivo contado</td><td style="text-align:right">${pesos(res.contado_cierre)}</td></tr>
      <tr><td><b>Diferencia</b></td><td style="text-align:right"><b>${dif}</b></td></tr>
      ${filasContadoOtros(res)}
    </table>
    <button class="btn primary" onclick="imprimirCierre(${res.caja_id})">🖨 Imprimir cierre</button>
    <button class="btn primary" onclick="abrirCajaModal()">Abrir nueva caja</button>
    <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>`;
  abrirModal();
}

// ---------- historial de cierres (punto 12) ----------
async function imprimirCierre(cajaId){
  let r; try{ r=await fetch('/api/caja/'+cajaId+'/imprimir',{method:'POST'}); }catch(e){ r=null; }
  if(r && r.ok){ const d=await r.json(); toast('Cierre enviado a '+d.impresora); }
  else { const e=r?await r.json():{}; toast('Error de impresión: '+(e.detail||'sin conexión')); }
}
async function historialCajas(){
  let data; try{ data = await (await fetch('/api/cajas')).json(); }catch(e){ toast('No se pudo cargar'); return; }
  const filas = (data.cajas||[]).map(c=>{
    const dif = c.descuadre==null ? '<span style="color:var(--muted)">—</span>'
      : (c.descuadre===0 ? '<span class="ok">cuadrada</span>'
        : (c.descuadre>0 ? `<span class="warn">+${pesos(c.descuadre)}</span>` : `<span class="bad">${pesos(c.descuadre)}</span>`));
    return `<tr>
      <td>#${c.caja_id}<br><span style="color:var(--muted);font-size:11px">${c.estado==='abierta'?'abierta':(c.cerrada_en||'').slice(0,16).replace('T',' ')}</span></td>
      <td>${c.cajero||'—'}</td>
      <td style="text-align:right">${pesos(c.total_ventas)}</td>
      <td style="text-align:right">${dif}</td>
      <td style="text-align:right"><button class="mini" onclick="verCierreDetalle(${c.caja_id})">Ver</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="color:var(--muted)">Sin cajas registradas</td></tr>';
  $('#modalBody').innerHTML = `<h3>Historial de cierres</h3>
    <table class="tabla">
      <tr><td class="sub-h">Caja</td><td class="sub-h">Cajero</td><td class="sub-h">Ventas</td><td class="sub-h">Cuadre</td><td class="sub-h"></td></tr>
      ${filas}
    </table>
    <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>`;
  abrirModal();
}
async function verCierreDetalle(cajaId){
  const r = await fetch('/api/caja/'+cajaId);
  if(!r.ok){ toast('No se pudo cargar la caja'); return; }
  const res = await r.json();
  const contadoRows = res.contado_cierre!=null ? `
    <tr><td>Efectivo contado</td><td style="text-align:right">${pesos(res.contado_cierre)}</td></tr>
    <tr><td><b>Diferencia</b></td><td style="text-align:right"><b>${textoDiferencia(res.descuadre||0)}</b></td></tr>
    ${filasContadoOtros(res)}` : '';
  $('#modalBody').innerHTML = `<h3>Caja #${res.caja_id}${res.estado==='abierta'?' (abierta)':''}</h3>
    ${resumenHTML(res)}
    <table class="tabla">${contadoRows}</table>
    <button class="btn primary" onclick="imprimirCierre(${res.caja_id})">🖨 Imprimir cierre</button>
    <button class="btn ghost" onclick="historialCajas()">Volver</button>`;
  abrirModal();
}

// ---------- version movil: pestañas (03-jul) ----------
// Las 3 columnas del escritorio se vuelven pestañas en pantalla chica. El CSS solo
// oculta columnas DENTRO del media query <=760px, asi que llamar esto en escritorio
// es inofensivo (las clases quedan puestas pero no aplican).
function setTabMovil(i){
  document.querySelectorAll('.grid > .col').forEach((c,idx)=>c.classList.toggle('mvisible', idx===i));
  [0,1,2].forEach(n=>{ const b=$('#tabBtn'+n); if(b) b.classList.toggle('on', n===i); });
  window.scrollTo({top:0});
}
// 12-ago-2026: mismo umbral que el @media(max-width:760px) de arriba -- si se cambia uno,
// se cambia el otro. Existe para no saltar de pestaña en escritorio, donde las 3 columnas
// ya se ven juntas y mover el scroll seria molesto sin motivo.
function esPantallaMovil(){
  return window.matchMedia('(max-width:760px)').matches;
}
function actualizarBadgesMovil(){

// ---------- Chat del bot en vivo (14-jul-2026: Christian no tenia forma de ver que
// conversa el bot con los clientes -- esto le baja la ansiedad; el banner rojo avisa
// si algun pedido de WhatsApp aun no llego a la cola (se reintenta solo). ----------
let botUltimoId=0, botMensajesSinLeer=0;
function chatModalAbierto(){
  // #botChatBody sigue en el DOM tras cerrarModal() (no borra el contenido, solo
  // oculta) -- por eso hay que exigir TAMBIEN que el modal este visible ('show').
  return $('#modal').classList.contains('show') && !!document.getElementById('botChatBody');
}
function renderTurnosBot(turnos){
  return turnos.map(t=>{
    const esBot = t.rol==='asistente';
    const quien = esBot ? '🤖 Bot' : ('📱 '+(t.telefono||'cliente'));
    const hora = (t.creado_en||'').slice(11,16);
    const texto = (t.texto||'').replace(/</g,'&lt;').replace(/\n/g,'<br>');
    return `<div class="chat-burbuja ${esBot?'bot':'cliente'}">
      <div class="chat-quien">${quien} · ${hora}</div>
      <div>${texto}</div></div>`;
  }).join('');
}
function chatModalHTML(turnos){
  const filas = renderTurnosBot(turnos) || '<div class="vacio">Sin conversaciones todavía.</div>';
  return `<h3 style="margin-top:0">💬 Conversación del bot (en vivo)</h3>
    <div id="botChatBody" style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;margin-bottom:10px">${filas}</div>
    <button class="mini" onclick="cerrarModal()">Cerrar</button>`;
}
function actualizarBadgeBot(){
  const b=$('#botBadge'); if(!b) return;
  if(botMensajesSinLeer>0){ b.textContent = botMensajesSinLeer>9?'9+':botMensajesSinLeer; b.style.display='inline-block'; }
  else b.style.display='none';
}
function beepBot(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.35);
  }catch(e){}
}
async function abrirChatBot(){
  botMensajesSinLeer=0; actualizarBadgeBot();
  let d; try{ d = await (await fetch('/api/bot/conversaciones?desde_id=0')).json(); }catch(e){ d=null; }
  if(!d || !d.disponible){
    $('#modalBody').innerHTML = `<h3 style="margin-top:0">💬 Conversación del bot</h3>
      <div class="vacio">Sin conexión con el bot ahora. Verifica que "Bot Patata.exe" esté encendido.</div>
      <button class="mini" onclick="cerrarModal()">Cerrar</button>`;
    abrirModal(false); return;
  }
  const turnos = d.turnos||[];
  botUltimoId = turnos.length ? turnos[turnos.length-1].id : botUltimoId;
  $('#modalBody').innerHTML = chatModalHTML(turnos);
  abrirModal(false);
  const body=$('#botChatBody'); if(body) body.scrollTop = body.scrollHeight;
}
function appendChatBot(nuevos){
  const body = document.getElementById('botChatBody'); if(!body) return;
  const casiAbajo = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  body.insertAdjacentHTML('beforeend', renderTurnosBot(nuevos));
  if(casiAbajo) body.scrollTop = body.scrollHeight;
}
async function pollBot(){
  let d; try{ d = await (await fetch('/api/bot/conversaciones?desde_id='+botUltimoId)).json(); }catch(e){ return; }
  const banner = $('#botPendBanner'); const pend = d.pendientes_respaldo||0; const rech = d.rechazados_respaldo||0;
  const alert = d.alertas_fallidas||0; const casoHum = d.casos_humanos||0;
  if(banner){
    banner.style.display = (pend>0||rech>0||alert>0||casoHum>0) ? 'block' : 'none';
    // 21-jul-2026: el aviso ya NO es "señal muerta". Antes decía "ingrésalo a mano"
    // y obligaba a releer el chat de WhatsApp. Ahora cada rechazado trae sus botones:
    // ingresarlo con el detalle YA capturado por el bot, o descartarlo dejando rastro.
    let h = '';
    if(pend>0){
      // 29-jul-2026: esta línea era la única señal muerta que quedaba en el banner --
      // decía el problema y no ofrecía nada. Ahora cada pendiente trae su conversación,
      // su pedido rearmable y la salida para cerrarlo.
      h += `<div style="margin-bottom:4px">⚠️ ${pend} pedido${pend>1?'s':''} de WhatsApp que <b>aún no ${pend>1?'llegan':'llega'}</b> a la cola (se sigue${pend>1?'n':''} reintentando solo${pend>1?'s':''}):</div><div id="botPendLista"></div>`;
    }
    if(rech>0){
      h += `<div style="margin-bottom:4px">❌ ${rech} pedido${rech>1?'s':''} de WhatsApp que el POS <b>rechazó</b>:</div><div id="botRechLista"></div>`;
    }
    if(alert>0){
      // 27-jul-2026 (S2): avisos al jefe que WhatsApp NO pudo entregar (ventana de 24h
      // cerrada, número caído), incluso después de reintentar -- no pueden depender
      // de que alguien esté mirando el chat en ese momento.
      h += `<div style="margin-bottom:4px">📵 ${alert} aviso${alert>1?'s':''} al jefe que WhatsApp <b>no pudo entregar</b>:</div><div id="botAlertaLista"></div>`;
    }
    if(casoHum>0){
      // 15-sep-2026: casos donde el bot derivó a una persona -- CON el WhatsApp ya
      // mandado, sea que Meta lo haya entregado y leído o no. No basta con que el
      // envío "se acepte": este panel no depende de que alguien mire el celular.
      h += `<div style="margin-bottom:4px">🙋 ${casoHum} caso${casoHum>1?'s':''} que el bot <b>derivó a una persona</b>:</div><div id="botCasoHumanoLista"></div>`;
    }
    banner.innerHTML = h;
    if(pend>0) pintarPendientes();
    if(rech>0) pintarRechazados();
    if(alert>0) pintarAlertasFallidas();
    if(casoHum>0) pintarCasosHumanos();
  }
  if(!d.disponible) return;
  const nuevos = d.turnos||[];
  if(!nuevos.length) return;
  botUltimoId = nuevos[nuevos.length-1].id;
  if(chatModalAbierto()){ appendChatBot(nuevos); }
  else{
    const nuevosCliente = nuevos.filter(t=>t.rol==='usuario');
    if(nuevosCliente.length){
      botMensajesSinLeer += nuevosCliente.length; actualizarBadgeBot(); beepBot();
      toast('💬 Nuevo mensaje de un cliente por WhatsApp', 3000);
    }
  }
}

// ---------- helpers ----------
function abrirModal(blocking){ const m=$('#modal'); m.classList.add('show'); m.dataset.block=blocking?'1':''; }
function cerrarModal(){ const m=$('#modal'); m.dataset.block=''; m.classList.remove('show'); }
$('#modal').onclick = e=>{ if(e.target.id==='modal' && $('#modal').dataset.block!=='1') cerrarModal(); };
let toastT; function toast(msg, duracion){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),duracion||2600); }

cargarUsuariosLogin();   // arranca en la pantalla de login; el POS (init) corre al autenticar
