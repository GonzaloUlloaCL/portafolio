<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Patata — Cajero</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2a2622">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // Aplica el tema guardado ANTES de pintar (evita el flash del tema equivocado).
  // Clave COMPARTIDA con wms.html: cambiar de noche en el POS tambien lo deja
  // en noche al entrar a /wms/ (misma localStorage, mismo origen).
  try{ document.documentElement.setAttribute('data-tema', localStorage.getItem('patata_tema')||'dia'); }catch(e){}
</script>
<style>
  :root{
    --bg:#f4f1ec; --panel:#ffffff; --ink:#2a2622; --muted:#8a8178;
    --line:#e7e1d8; --accent:#e8731f; --accent-d:#c95e12;
    --ok:#2e9e5b; --warn:#d8a300; --bad:#d2452f; --chip:#f0ebe3;
    --shadow:0 1px 3px rgba(0,0,0,.08); --header-bg:var(--ink);
  }
  /* --- Turno Noche (14-jul-2026): mismo look de dia, boton aparte para cambiar.
     Paleta de marca (rojo/dorado/oliva sobre espresso), no un dark-mode generico. --- */
  :root[data-tema="noche"]{
    --bg:#1E1108; --panel:#2F1D12; --ink:#F3E9D9; --muted:#B79A7C;
    --line:#4a3520; --accent:#FF4B3E; --accent-d:#E63A2E;
    --ok:#9BCB63; --warn:#FFC64A; --bad:#FF6A55; --chip:#3a2c1c;
    --shadow:0 1px 3px rgba(0,0,0,.4); --header-bg:#140C05;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:var(--header-bg);color:#fff}
  header .logo{font-size:22px}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
  header .sub{font-size:12px;color:#c9c2b8;margin-left:auto}
  .grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;padding:10px;
    height:calc(100vh - 52px);overflow:hidden}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
  .col h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    margin:0;padding:9px 14px 6px}
  .col .body{padding:0 14px 10px;overflow:auto;flex:1}

  /* --- menu --- */
  .cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
  .cat{border:1px solid var(--line);background:var(--chip);color:var(--ink);
    border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}
  .cat.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .cat-nota{font-size:12px;color:var(--muted);padding:0 14px 8px}
  .prods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .prod{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px;
    text-align:left;cursor:pointer;transition:.08s}
  .prod:hover{border-color:var(--accent);transform:translateY(-1px)}
  .prod .n{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px}
  .prod .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.25}
  .prod .p{font-size:13px;color:var(--accent-d);font-weight:700;margin-top:6px}
  .badge2x{font-size:10px;background:var(--accent);color:#fff;border-radius:5px;
    padding:1px 5px;font-weight:700}

  /* --- pedido --- */
  .items{display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
  .item{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);
    border-radius:9px;padding:6px 8px}
  .item-main{display:flex;align-items:center;gap:8px}
  .item .info{flex:1;min-width:0}
  .item .info .t{font-weight:600;font-size:14px}
  .item .info .s{font-size:11px;color:var(--muted)}
  .tag{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;
    font-size:11px;font-weight:700;color:var(--accent-d)}
  .nota-item{width:100%;border:1px dashed var(--line);border-radius:7px;padding:5px 8px;
    font-size:12px;font-family:inherit;background:var(--panel)}
  .nota-item:focus{border-style:solid;border-color:var(--accent);outline:none}
  .nota-item::placeholder{color:var(--muted)}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:var(--chip);font-size:16px;cursor:pointer;line-height:1}
  .qty span{min-width:18px;text-align:center;font-weight:700}
  .x{border:none;background:none;color:var(--bad);cursor:pointer;font-size:16px;padding:2px 4px}
  .vacio{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
  .fields label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
  .fields input,.fields select,.fields textarea{width:100%;border:1px solid var(--line);
    border-radius:8px;padding:7px 8px;font-size:14px;font-family:inherit;background:var(--panel);color:var(--ink)}
  .fields .full{grid-column:1 / -1}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:none;background:var(--panel);color:var(--ink);padding:7px;cursor:pointer;font-size:13px;font-weight:600}
  .seg button.on{background:var(--accent);color:#fff}
  .pagos{display:flex;flex-wrap:wrap;gap:6px}
  .pagos button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;
    cursor:pointer;font-size:13px;font-weight:600;text-transform:capitalize}
  .pagos button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .total{display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid var(--line);margin-top:5px;padding-top:8px}
  .total .lbl{font-size:13px;color:var(--muted)}
  .total .val{font-size:26px;font-weight:800}
  .promo-nota{font-size:11px;color:var(--accent-d);text-align:right}
  .alert{background:#fbeee9;border:1px solid #f0c4b5;color:var(--bad);
    border-radius:8px;padding:7px 9px;font-size:12px;margin-top:8px}
  .btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;
    font-weight:700;cursor:pointer;margin-top:10px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:disabled{background:#d9cfc4;cursor:not-allowed}
  .btn.ghost{background:var(--chip);color:var(--ink)}

  /* --- cola --- */
  /* Color por MODALIDAD, siempre visible (02-jul-2026): antes solo se pintaba
     en_preparacion (cocina-local/cocina-delivery); ahora se ve de un vistazo en
     toda la cola sin importar el estado. delivery=naranjo, local=verde, retiro=negro. */
  .pedido{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:6px}
  .pedido.mod-local{border-left:5px solid var(--ok);background:#f1faf4}
  .pedido.mod-delivery{border-left:5px solid var(--accent);background:#fff4ea}
  .pedido.mod-retiro{border-left:5px solid #1a1a1a;background:#f4f4f3}
  /* Pedido PROGRAMADO (04-ago-2026, P29): morado, pisa el color de modalidad a
     proposito -- tiene que distinguirse de un vistazo de un pedido normal, sea cual
     sea su modalidad, para que cocina no lo prepare antes de la hora pactada. */
  .pedido.programado{border-left:5px solid #7F56D9;background:#f6f2fd}
  .programado-aviso{font-weight:700;font-size:12px;color:#7F56D9;margin:3px 0}
  /* Pre-cocina (07-jul-2026, pedido de Gonza): mientras el pedido NO fue a cocina
     (estado 'recibido' o el legacy 'confirmado') el fondo es BLANCO, para ver de un
     vistazo lo que todavia falta mandar a la cocina; conserva el borde de color de su
     modalidad. Al pasar a cocina toma el fondo de color de su modalidad. Va DESPUES de
     las reglas .mod-* para ganar por orden (misma especificidad, 2 clases). */
  .pedido.est-recibido, .pedido.est-confirmado{background:var(--panel)}
  .pedido .top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .pedido .id{font-weight:800}
  .canal{font-size:10px;border-radius:5px;padding:1px 6px;font-weight:700;text-transform:uppercase}
  .canal.cajero{background:#e9eef6;color:#3a5a8a}
  .canal.whatsapp{background:#e3f4e8;color:#2e7d46}
  .canal.web{background:#f3ebf7;color:#7a4a9a}
  .estado{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--chip);text-transform:uppercase;letter-spacing:.4px}
  .estado.recibido{background:#fff2dc;color:#9a6b00}
  .estado.confirmado{background:#e9eef6;color:#3a5a8a}
  .estado.en_preparacion{background:#fde7d6;color:#b25a12}
  .estado.listo{background:#e3f4e8;color:#1f7a3e}
  /* EN REPARTO (29-jul-2026): mismo estado `listo` del motor, pero para delivery
     significa "va en la moto", NO "terminado" -- por eso azul y no verde: en plena
     cocina el verde se lee como "ya está" y este pedido todavía no llegó. */
  .estado.listo.reparto{background:#dbe7fd;color:#1d4ed8}
  .pedido .resumen{font-size:12px;color:var(--muted);line-height:1.25}
  .pedido .pie{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
  .pedido .pie .t{font-weight:800;margin-right:auto}
  .mini{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 9px;
    font-size:12px;cursor:pointer;font-weight:600}
  .mini.go{background:var(--ok);color:#fff;border-color:var(--ok)}
  .mini.cancel{color:var(--bad);border-color:#f0c4b5}
  .badge-chat{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;
    border-radius:10px;min-width:16px;height:16px;font-size:10px;line-height:16px;
    text-align:center;padding:0 4px;font-weight:700}
  .chat-burbuja{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:85%;font-size:13px}
  .chat-burbuja.bot{background:#eef3ff;margin-left:auto}
  .chat-burbuja.cliente{background:#fff7e6}
  .chat-quien{font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:600}

  /* --- modal --- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
    align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);color:var(--ink);border-radius:14px;max-width:440px;width:100%;max-height:90vh;
    overflow:auto;padding:18px}
  .modal h3{margin:0 0 4px}
  .modal .opts{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .opt{border:1px solid var(--line);background:var(--chip);border-radius:9px;
    padding:9px 12px;cursor:pointer;font-size:14px;font-weight:600}
  .opt.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .modal .lbl{font-size:12px;color:var(--muted);margin-top:8px}
  pre.comanda{background:#1d1a17;color:#f0e9df;border-radius:10px;padding:14px;
    font-size:13px;line-height:1.4;overflow:auto;white-space:pre-wrap}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;
    opacity:0;transition:.25s;z-index:60}
  .toast.show{opacity:1}

  /* --- caja --- */
  .caja-hdr{display:flex;align-items:center;gap:8px;font-size:12px;color:#e7e0d6;flex-wrap:wrap}
  .caja-hdr b{color:#fff}
  .caja-hdr .k{color:#b9b1a6}
  .caja-hdr .cj{font-weight:800;color:#fff;background:#3a3530;border-radius:6px;padding:2px 8px}
  .caja-hdr .cj.cerrada{color:#f0b6a8;background:#4a2a24}
  .cj-btn{border:1px solid #5a534b;background:#3a3530;color:#fff;border-radius:7px;
    padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .cj-btn.cerrar{background:var(--accent);border-color:var(--accent)}
  .tabla{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
  .tabla td{padding:5px 4px;border-bottom:1px solid var(--line)}
  .tabla .sub-h{color:var(--muted);font-size:11px;text-transform:uppercase;
    padding-top:10px;border-bottom:none}
  .modal input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;
    font-size:14px;font-family:inherit;margin-bottom:6px;background:var(--panel);color:var(--ink)}
  .big-input{font-size:22px;font-weight:800;text-align:right;padding:10px}
  .descuadre{text-align:center;font-weight:800;font-size:16px;margin:6px 0 10px}
  .descuadre .ok{color:var(--ok)} .descuadre .warn{color:var(--warn)} .descuadre .bad{color:var(--bad)}
  .vuelto{font-size:14px;margin-top:4px;font-weight:700;color:var(--accent-d)}
  .vuelto .bad{color:var(--bad)}
  .cliente-estado{font-size:12px;margin-top:4px;font-weight:600;min-height:14px}
  .cliente-estado.ok{color:var(--ok)}
  .cliente-estado.nuevo{color:var(--accent-d)}
  .sugerencias{border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:170px;overflow:auto;background:var(--panel)}
  .sugerencias div{padding:7px 9px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
  .sugerencias div:last-child{border-bottom:none}
  .sugerencias div:hover{background:var(--chip)}
  .btn-buscar{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 14px;cursor:pointer;font-weight:700}
  .banner-edit{display:flex;align-items:center;gap:8px;background:#fff3e6;border:1px solid #f0c98a;
    border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--accent-d)}

  /* --- version movil (03-jul, "cajero portatil"): en pantallas chicas el POS se
     convierte en una app de 3 pestañas (Menu / Pedido / Cola) con barra inferior
     fija, en vez de 3 columnas apiladas en un scroll eterno. Mismas preferencias
     de la version escritorio (colores por modalidad, espaciado compacto, labels):
     es el MISMO archivo, no un fork — lo que se cambie aqui se ve en ambos. --- */
  .tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:var(--header-bg);border-top:1px solid #4a443d;
    padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;border:none;background:none;color:#c9c2b8;font-size:13px;
    font-weight:700;padding:9px 4px;border-radius:9px;cursor:pointer;line-height:1.2}
  .tabbar button.on{background:#3a3530;color:#fff}
  .tabbar button .tb-sub{display:block;font-size:10px;font-weight:600;color:var(--accent);margin-top:2px}
  @media(max-width:760px){
    body{font-size:16px}                      /* mas legible en mano, no achica nada */
    header{flex-wrap:wrap;gap:6px;padding:8px 10px}
    header .sub{margin-left:0}
    .grid{grid-template-columns:1fr;height:auto;overflow:visible;padding:8px;
      padding-bottom:76px}                     /* aire para la tabbar */
    .col{display:none;min-height:calc(100vh - 150px)}
    .col.mvisible{display:flex}
    .tabbar{display:flex}
    /* targets tactiles: dedos, no mouse (percepcion POV usuario) */
    .prod{padding:12px 10px}
    .cat{padding:9px 14px;font-size:14px}
    .seg button,.pagos button{padding:12px 8px;font-size:15px}
    .mini{padding:9px 12px;font-size:14px}
    .qty button{width:36px;height:36px;font-size:20px}
    .btn{padding:15px;font-size:17px}
    .fields input,.fields select{padding:11px 10px;font-size:16px}
    .x{font-size:20px;padding:6px 8px}
    .prods{grid-template-columns:1fr 1fr}
  }

  @media print{
    @page{size:80mm auto;margin:3mm}
    body *{visibility:hidden}
    #modal,#modal *{visibility:visible}
    #modal{position:absolute;inset:0;background:#fff;padding:0}
    .overlay{background:#fff;padding:0;display:block}
    .modal{box-shadow:none;max-width:none;width:72mm;padding:0}
    .modal h3{font-size:13px;margin:0 0 4px}
    pre.comanda{background:#fff;color:#000;border:none;padding:0;font-size:11px;
      white-space:pre-wrap;font-family:"Consolas","Courier New",monospace}
    .no-print{display:none!important}
  }
  @media(max-width:1000px){.grid{grid-template-columns:1fr;height:auto;overflow:visible}}

  /* --- Turno Noche: overrides puntuales para los colores "tinte" que en modo dia
     son un color plano propio (no el mismo blanco del panel), asi que no bastaba
     con los tokens de :root. Cada uno preserva el MISMO significado (verde=local,
     naranjo=delivery, etc), solo oscurecido. --- */
  [data-tema="noche"] .pedido.mod-local{background:#16241a}
  [data-tema="noche"] .pedido.mod-delivery{background:#2e2013}
  [data-tema="noche"] .pedido.mod-retiro{background:#241a10;border-left-color:#c2a988}
  [data-tema="noche"] .pedido.programado{background:#251c38;border-left-color:#B794F6}
  [data-tema="noche"] .programado-aviso{color:#B794F6}
  [data-tema="noche"] .canal.cajero{background:#1a2a3a;color:#8ab4e8}
  [data-tema="noche"] .canal.whatsapp{background:#16301f;color:#7ed99a}
  [data-tema="noche"] .canal.web{background:#2a1c34;color:#c99ee0}
  [data-tema="noche"] .estado.recibido{background:#3a2c10;color:#FFC64A}
  [data-tema="noche"] .estado.confirmado{background:#1a2a3a;color:#8ab4e8}
  [data-tema="noche"] .estado.en_preparacion{background:#3a2410;color:#FF9D5C}
  [data-tema="noche"] .estado.listo{background:#16301f;color:#7ed99a}
  [data-tema="noche"] .estado.listo.reparto{background:#16233f;color:#7EA6FF}
  [data-tema="noche"] .chat-burbuja.bot{background:#1a2438}
  [data-tema="noche"] .chat-burbuja.cliente{background:#332512}
  [data-tema="noche"] .btn.primary:disabled{background:#4a3a2a;color:#8a7a68}
  [data-tema="noche"] .alert{background:#3a1e16;border-color:#7a4030}
  [data-tema="noche"] .banner-edit{background:#3a2a12;border-color:#8a6a2c}
  [data-tema="noche"] .mini.cancel{border-color:#5a3428}
  [data-tema="noche"] #botPendBanner{background:#3a1e16!important;color:#FF9D8A!important;border-color:#7a4030!important}

  /* --- boton del toggle dia/noche, junto al usuario en el header --- */
  .theme-toggle{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);
    color:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;gap:5px;margin-left:8px}
  .theme-toggle:hover{background:rgba(255,255,255,.16)}
</style>
</head>
<body>
<header>
  <span class="logo">🥔</span>
  <h1 id="titulo">POS Patata — Cajero</h1>
  <div class="caja-hdr" id="cajaHdr"></div>
  <button class="cj-btn" id="btnAdmin" style="display:none" onclick="pantallaAdmin()">⚙ Admin</button>
  <button class="cj-btn" id="btnWMS" style="display:none" onclick="window.open('/wms/','_blank')">📦 Inventario y Finanzas</button>
  <button class="theme-toggle no-print" id="btnTema" onclick="alternarTema()" title="Cambiar a Turno Noche"></button>
  <span class="sub" id="usuarioHdr"></span>
  <span class="sub" id="reloj" style="margin-left:12px"></span>
</header>

<div class="grid">
  <!-- MENU -->
  <section class="col">
    <h2>Menú — toca un producto</h2>
    <div class="cats" id="cats"></div>
    <div class="cat-nota" id="catNota"></div>
    <div class="body"><div class="prods" id="prods"></div></div>
  </section>

  <!-- PEDIDO ACTUAL -->
  <section class="col">
    <h2>Pedido actual</h2>
    <div class="body">
      <div id="bannerEdit" class="banner-edit" style="display:none">
        ✏️ Editando pedido #<span id="bannerEditId"></span>
        <button type="button" class="mini" style="margin-left:auto" onclick="cancelarEdicion()">Cancelar edición</button>
      </div>
      <div class="fields">
        <div class="full">
          <label>Seleccione modalidad</label>
          <div class="seg" id="segModalidad">
            <button data-v="retiro">Retiro</button>
            <button data-v="delivery">Delivery</button>
            <button data-v="local" class="on">Local</button>
          </div>
        </div>
        <div class="full" id="boxTelefono">
          <label>Teléfono del cliente (9 dígitos)</label>
          <div style="display:flex;gap:6px">
            <input id="telefono" inputmode="numeric" placeholder="9 1234 5678" oninput="onTelInput()" autocomplete="off" style="flex:1">

<script>
const $ = s => document.querySelector(s);
// Escapa texto que viene de AFUERA (nombre, dirección o mensaje que escribió un
// cliente por WhatsApp) antes de meterlo en un innerHTML. Sin esto, un cliente que
// se llame `<img onerror=...>` ejecuta código en la pantalla del local.
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// ---------- Turno Noche (14-jul-2026): toggle dia/noche, clave compartida con /wms/ ----------
function pintarBotonTema(){
  const noche = document.documentElement.getAttribute('data-tema')==='noche';
  const b=$('#btnTema'); if(!b) return;
  b.textContent = noche ? '☀ Turno Día' : '🌙 Turno Noche';
  b.title = noche ? 'Volver al turno día' : 'Cambiar a Turno Noche';
}
function alternarTema(){
  const actual = document.documentElement.getAttribute('data-tema')==='noche' ? 'noche' : 'dia';
  const nuevo = actual==='noche' ? 'dia' : 'noche';
  document.documentElement.setAttribute('data-tema', nuevo);
  void document.body.offsetHeight; // fuerza el recalculo de estilos de inmediato (sin costo)
  try{ localStorage.setItem('patata_tema', nuevo); }catch(e){}
  pintarBotonTema();
}
pintarBotonTema();
let MENU=null, catActual=0, pedido=[], TRANS={}, modalidad="local", formaPago=null;
let CAJA=null, totalActual=0, editandoId=null;   // CAJA = resumen de la caja abierta; editandoId = pedido en edición
let pagosUI=null, pagoConUI=null;   // pagosUI: array [{metodo,monto}] = pago dividido; pagoConUI: efectivo con que paga
let SESION=null;   // usuario logueado + permisos
// Toda llamada al propio servidor lleva el token de sesion (la puerta de la API exige sesion
// en todo /api/). Se envuelve fetch una sola vez en vez de tocar las ~68 llamadas.
(function(){ const _f=window.fetch.bind(window);
  window.fetch=function(u,o){ o=o||{}; try{
    const url=(typeof u==='string')?u:(u&&u.url)||'';
    if(SESION&&SESION.sesion&&(url.startsWith('/')||url.startsWith(location.origin))){
      const h=new Headers(o.headers||{}); if(!h.has('X-Sesion')) h.set('X-Sesion',SESION.sesion); o.headers=h; }
  }catch(e){} return _f(u,o); }; })();

async function cargarUsuariosLogin(){
  try{ const d=await (await fetch('/api/usuarios-login')).json();
    $('#loginUser').innerHTML=(d.usuarios||[]).filter(u=>u.activo).map(u=>`<option value="${(u.nombre||'').replace(/"/g,'')}">${u.nombre} · ${u.perfil||'—'}</option>`).join('');
  }catch(e){}
}
async function hacerLogin(){
  const ident=$('#loginUser').value, pin=$('#loginPin').value;
  let r; try{ r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identificador:ident,pin})}); }catch(e){ $('#loginError').textContent='Sin conexión'; return; }
  if(!r.ok){ $('#loginError').textContent='PIN incorrecto'; $('#loginPin').value=''; return; }
  SESION=await r.json();
  $('#login').classList.remove('show');
  $('#usuarioHdr').innerHTML=`👤 ${SESION.nombre} · <a href="#" onclick="salir();return false" style="color:#c9c2b8;text-decoration:underline">salir</a>`;
  $('#btnAdmin').style.display = tabsAdminDisponibles().length ? 'inline-block' : 'none';
  $('#btnWMS').style.display = (puede('ver_reportes_wms')||puede('gestionar_insumos')||puede('ver_finanzas')) ? 'inline-block' : 'none';
  init();
}
const puede = p => !!(SESION && (SESION.permisos||[]).includes(p));
function salir(){ try{ fetch('/api/logout',{method:'POST',headers:headersConUsuario()}); }catch(e){} SESION=null; adminMenuCache=null; adminMenuCatSel=null; location.reload(); }
// El backend vuelve a validar el permiso el mismo (punto 21c); esto solo IDENTIFICA
// quien esta pidiendo la accion (nunca hay que confiar en lo que decida el frontend).
function headersConUsuario(){
  const h = {'Content-Type':'application/json'};
  if(SESION && SESION.sesion) h['X-Sesion'] = SESION.sesion;
  return h;
}

// ---------- Admin: usuarios, perfiles, menú y clientes ----------
function tabsAdminDisponibles(){
  const tabs=[];
  if(puede('gestionar_usuarios')){ tabs.push('usuarios','perfiles','auditoria'); }
  if(puede('editar_menu')) tabs.push('menu','comanda');
  if(puede('gestionar_clientes')) tabs.push('clientes');
  return tabs;
}

async function contenidoAuditoria(){
  const data = await (await fetch('/api/auditoria')).json();
  const filas = (data.eventos||[]).map(e=>`
    <tr>
      <td style="font-size:12px;white-space:nowrap">${(e.en||'').slice(0,16).replace('T',' ')}</td>
      <td>${e.usuario||'—'}</td>
      <td><span class="tag">${e.accion}</span></td>
      <td style="font-size:12px;color:var(--muted)">${e.detalle||''}${e.pedido_id?` (#${e.pedido_id})`:''}</td>
    </tr>`).join('');
  return `<table class="tabla">${filas || '<tr><td style="color:var(--muted)">Sin eventos registrados todavía</td></tr>'}</table>`;
}

async function pantallaAdmin(tab){
  const disponibles = tabsAdminDisponibles();
  if(!disponibles.length){ toast('No tienes permisos de administración'); return; }
  tab = (tab && disponibles.includes(tab)) ? tab : disponibles[0];
  let contenido;
  try{
    if(tab==='usuarios') contenido = await contenidoUsuarios();
    else if(tab==='perfiles') contenido = await contenidoPerfiles();
    else if(tab==='auditoria') contenido = await contenidoAuditoria();
    else if(tab==='menu') contenido = await contenidoMenu();
    else if(tab==='comanda') contenido = await contenidoComanda();
    else contenido = contenidoClientes();
  }catch(e){ toast('No se pudo cargar'); return; }
  const tabBtns = [];
  if(puede('gestionar_usuarios')){
    tabBtns.push(`<button class="${tab==='usuarios'?'on':''}" onclick="pantallaAdmin('usuarios')">Usuarios</button>`);
    tabBtns.push(`<button class="${tab==='perfiles'?'on':''}" onclick="pantallaAdmin('perfiles')">Perfiles</button>`);
    tabBtns.push(`<button class="${tab==='auditoria'?'on':''}" onclick="pantallaAdmin('auditoria')">Auditoría</button>`);
  }
  if(puede('editar_menu')) tabBtns.push(`<button class="${tab==='menu'?'on':''}" onclick="pantallaAdmin('menu')">Menú</button>`);
  if(puede('editar_menu')) tabBtns.push(`<button class="${tab==='comanda'?'on':''}" onclick="pantallaAdmin('comanda')">🎨 Comanda</button>`);
  if(puede('gestionar_clientes')) tabBtns.push(`<button class="${tab==='clientes'?'on':''}" onclick="pantallaAdmin('clientes')">Clientes</button>`);
  $('#modalBody').innerHTML = `
    <h3>⚙ Administración</h3>
    <div class="seg" style="margin-bottom:10px;flex-wrap:wrap">${tabBtns.join('')}</div>
    ${contenido}
    <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>`;
  abrirModal();
  if(tab==='menu') renderAdminMenuProductos();
  if(tab==='comanda') renderEditorComanda();
}

async function contenidoUsuarios(){
  const data = await (await fetch('/api/usuarios')).json();
  const filas = (data.usuarios||[]).map(u=>`
    <tr style="${u.activo?'':'opacity:.5'}">
      <td>${u.nombre}${u.email?`<br><span style="color:var(--muted);font-size:11px">${u.email}</span>`:''}${u.activo?'':' <span class="tag">inactivo</span>'}</td>
      <td>${u.perfil||'—'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="mini" onclick="adminEditarUsuario(${u.id})">Editar</button>
        <button class="mini" onclick="adminCambiarPin(${u.id})">PIN</button>
        ${u.activo?`<button class="mini cancel" onclick="adminToggleUsuario(${u.id},false)">Desactivar</button>`
                  :`<button class="mini go" onclick="adminToggleUsuario(${u.id},true)">Reactivar</button>`}
      </td>
    </tr>`).join('');
  return `<table class="tabla">${filas || '<tr><td style="color:var(--muted)">Sin usuarios</td></tr>'}</table>
    <button class="btn primary" onclick="adminCrearUsuarioModal()">+ Nuevo usuario</button>`;
}

async function contenidoPerfiles(){
  const data = await (await fetch('/api/usuarios')).json();
  const filas = (data.perfiles||[]).map(p=>`
    <tr>
      <td>${p.nombre}${p.es_admin?' <span class="tag">admin</span>':''}</td>
      <td style="font-size:12px;color:var(--muted)">${(p.permisos||[]).join(', ')||'(sin permisos)'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="mini" onclick="adminEditarPerfil(${p.id})">Editar</button>
        <button class="mini cancel" onclick="adminBorrarPerfilConfirm(${p.id},'${(p.nombre||'').replace(/'/g,"\\'")}')">Borrar</button>
      </td>
    </tr>`).join('');
  return `<table class="tabla">${filas || '<tr><td style="color:var(--muted)">Sin perfiles</td></tr>'}</table>
    <button class="btn primary" onclick="adminCrearPerfilModal()">+ Nuevo perfil</button>`;
}

async function adminCrearUsuarioModal(){
  const d = await (await fetch('/api/usuarios')).json();
  formUsuario(null, d.perfiles||[]);
}
async function adminEditarUsuario(id){
  const d = await (await fetch('/api/usuarios')).json();
  formUsuario((d.usuarios||[]).find(x=>x.id===id), d.perfiles||[]);
}
function formUsuario(u, perfiles){
  const editando = !!u;
  $('#modalBody').innerHTML = `
    <h3>${editando?'Editar usuario':'Nuevo usuario'}</h3>
    <div class="lbl">Nombre</div>
    <input id="fuNombre" value="${(u&&u.nombre||'').replace(/"/g,'&quot;')}" placeholder="Nombre">
    <div class="lbl">Email (opcional)</div>
    <input id="fuEmail" value="${(u&&u.email||'').replace(/"/g,'&quot;')}" placeholder="email@ejemplo.com">
    <div class="lbl">Perfil</div>
    <select id="fuPerfil" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px">
      ${perfiles.map(p=>`<option value="${p.id}" ${u&&u.perfil_id===p.id?'selected':''}>${p.nombre}</option>`).join('')}
    </select>
    ${editando?'':`<div class="lbl">PIN inicial</div><input id="fuPin" type="password" inputmode="numeric" placeholder="PIN">`}
    <div id="fuError" style="color:var(--bad);font-size:12px;font-weight:600;min-height:16px;margin-top:6px"></div>
    <button class="btn primary" onclick="${editando?`guardarUsuario(${u.id})`:'crearUsuarioForm()'}">${editando?'Guardar':'Crear'}</button>

}
async function crearUsuarioForm(){
  const body={nombre:$('#fuNombre').value.trim(), email:$('#fuEmail').value.trim(),
    perfil_id:+$('#fuPerfil').value, pin:$('#fuPin').value};
  const r=await fetch('/api/usuarios',{method:'POST',headers:headersConUsuario(),body:JSON.stringify(body)});

}
async function guardarUsuario(id){
  const body={nombre:$('#fuNombre').value.trim(), email:$('#fuEmail').value.trim(), perfil_id:+$('#fuPerfil').value};
  const r=await fetch('/api/usuarios/'+id,{method:'PUT',headers:headersConUsuario(),body:JSON.stringify(body)});
  if(!r.ok){ const e=await r.json(); $('#fuError').textContent=e.detail||'Error'; return; }

function adminCambiarPin(id){
  $('#modalBody').innerHTML = `<h3>Cambiar PIN</h3>
    <div class="lbl">Nuevo PIN</div>
    <input id="nuevoPinInput" type="password" inputmode="numeric" placeholder="Nuevo PIN">

// ---------- Admin: menú (categorías, subcategorías/productos, combos) ----------
let adminMenuCache = null;    // menu.json crudo cargado para editar (se recarga tras cada guardado)
let adminMenuCatSel = null;   // nombre de la categoria seleccionada (NO indice: sobrevive a reordenar)
let adminFiltroSin2x = false; // 03-ago-2026: filtro "mostrar solo sin 2x" en Editar precios

function _swap(arr, i, j){ const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }

function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj); }
function setPath(obj, path, val){
  const partes = path.split('.'); let o = obj;
  for(let i=0;i<partes.length-1;i++){ if(o[partes[i]]==null) o[partes[i]]={}; o = o[partes[i]]; }
  o[partes[partes.length-1]] = val;
}
// Que campos de precio tiene un producto, segun su forma (igual criterio que el
// tarificador: precio simple, churrasco/mechada, XL/normal, tamanos, o porciones).
function camposPrecioDe(p){
  const out=[];
  if('precio' in p){ out.push({path:'precio', label:'Precio'}); if('precio_2x' in p) out.push({path:'precio_2x', label:'Precio 2x'}); }
  if('precio_churrasco' in p) out.push({path:'precio_churrasco', label:'Churrasco'});
  if('precio_mechada' in p) out.push({path:'precio_mechada', label:'Mechada'});
  if('xl_30cm' in p){ out.push({path:'xl_30cm.precio', label:'XL 30cm'}); if(p.xl_30cm && 'precio_2x' in p.xl_30cm) out.push({path:'xl_30cm.precio_2x', label:'XL 30cm 2x'}); }
  if('normal_22cm' in p){ out.push({path:'normal_22cm.precio', label:'Normal 22cm'}); if(p.normal_22cm && 'precio_2x' in p.normal_22cm) out.push({path:'normal_22cm.precio_2x', label:'Normal 22cm 2x'}); }
  if('individual' in p) out.push({path:'individual', label:'Individual'});
  if('mediana' in p) out.push({path:'mediana', label:'Mediana'});
  if('grande' in p) out.push({path:'grande', label:'Grande'});
  if('precio_6' in p) out.push({path:'precio_6', label:'6u'});
  if('precio_10' in p) out.push({path:'precio_10', label:'10u'});
  return out;
}

// ---------- Vinculador visual de promos 2x (07-jul-2026) ----------
// Administra el campo `grupo` del menu, que enlaza productos DISTINTOS para la promo 2x
// cruzada (el Italiano y sus armados, Completo+Dinamico, etc.). Se tocan los productos y
// los que comparten grupo se pintan del mismo color -> "vincular en vivo y visualmente".
// El precio del par (precio_2x) se afina en "Editar precios" (que ya lo expone por producto
// y por variante); aca solo se ASEGURA que el campo exista (placeholder = precio x2, que NO
// regala nada) para que el editor lo muestre y el motor pueda cobrarlo. Resuelve ademas el
// caso de revincular un SKU que se borro y se recreo. Persiste con guardarMenuCompleto
// (/api/menu-edit, que valida el menu con el Tarificador antes de escribir).
const COLORES_2X = ["#1D9E75","#BA7517","#7F77DD","#D85A30","#378ADD","#D4537E","#3B6D11"];
let _v2xSel = new Set();
function _catSel2x(){ return adminMenuCache.categorias.find(c=>c.nombre===adminMenuCatSel); }
function _slug2x(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }
function _coloresDeGrupos(cat){
  const orden=[]; (cat.productos||[]).forEach(p=>{ if(p.grupo && orden.indexOf(p.grupo)<0) orden.push(p.grupo); });
  const map={}; orden.forEach((g,i)=>map[g]=COLORES_2X[i%COLORES_2X.length]); return map;
}
function _soporta2x(p){ return ('precio' in p) || (p.xl_30cm && typeof p.xl_30cm==='object') || (p.normal_22cm && typeof p.normal_22cm==='object'); }
function _info2x(p){   // precio unitario base + precio del par si esta CONFIGURADO (no placeholder)
  if('precio' in p){ const u=+p.precio||0, par=(p.precio_2x==null)?null:+p.precio_2x; return {u, par, conf: par!=null && par < u*2}; }
  let u=null, par=null, conf=false;
  ['xl_30cm','normal_22cm'].forEach(v=>{ if(p[v]&&typeof p[v]==='object'){ const uu=+p[v].precio||0; if(u==null)u=uu; if(p[v].precio_2x!=null){ par=+p[v].precio_2x; if(par<uu*2) conf=true; } } });
  return {u, par, conf};
}
function _asegurarPrecio2x(p){   // crea el campo precio_2x si falta, en placeholder seguro (x2, sin descuento)
  if('precio' in p){ if(p.precio_2x==null) p.precio_2x=(+p.precio||0)*2; return; }
  ['xl_30cm','normal_22cm'].forEach(v=>{ if(p[v]&&typeof p[v]==='object' && p[v].precio_2x==null) p[v].precio_2x=(+p[v].precio||0)*2; });
}

// ---------- Semáforo + contador + filtro del 2x en "Editar precios" (03-ago-2026,
// pedido de Gonza). "Cargado" = existe el campo precio_2x, sin importar si el
// descuento es real -- las Mechadas NO lo tienen a propósito (confirmado por
// Christian), así que "existe" es la pregunta correcta acá. Distinto del
// _info2x().conf de arriba, que además exige un descuento real y es para el
// vinculador visual, no para este contador.
//
// `sin_2x_confirmado` (booleano, a nivel de producto): Gonza marcó que un producto
// SIN 2x sea un falso positivo (Mechadas hoy) para siempre, hasta que alguien lo
// desmarque -- sin esto, el filtro/semaforo lo mostraria como "falta" para siempre,
// aunque la decision de no tener 2x ya este tomada.
function _slots2x(p){   // un slot por cada precio que ACEPTA promo 2x (1 o 2 por producto)
  if(!_soporta2x(p)) return [];
  const confirmado = p.sin_2x_confirmado === true;
  if('precio' in p) return [{path: 'precio_2x', tiene: p.precio_2x != null, confirmado}];
  const out = [];
  ['xl_30cm', 'normal_22cm'].forEach(v => {
    if(p[v] && typeof p[v] === 'object')
      out.push({path: v + '.precio_2x', tiene: p[v].precio_2x != null, confirmado});
  });
  return out;
}
function _resumen2xDe(categorias){
  let con = 0, total = 0, confirmados = 0;
  (categorias || []).forEach(cat => (cat.productos || []).forEach(p =>
    _slots2x(p).forEach(s => {
      if(s.confirmado){ confirmados++; return; }   // no cuenta ni en contra ni a favor
      total++; if(s.tiene) con++;
    })));
  return {con, total, confirmados};
}
async function adminAgregarPrecio2x(catIdx, prodIdx){
  const p = adminMenuCache.categorias[catIdx].productos[prodIdx];
  _asegurarPrecio2x(p);
  delete p.sin_2x_confirmado;   // si algun dia se carga el precio real, la confirmacion vieja queda obsoleta
  renderAdminMenuProductos();
}
// 04-ago-2026 (Gonza): marca/desmarca un producto como "sin 2x a proposito" (no un
// olvido) -- persiste de una, como el resto de las acciones de un clic de esta pantalla
// (mover categoria/producto). `quitar=true` revierte la confirmacion.
async function adminConfirmarSin2x(catIdx, prodIdx, quitar){
  const p = adminMenuCache.categorias[catIdx].productos[prodIdx];
  if(quitar) delete p.sin_2x_confirmado; else p.sin_2x_confirmado = true;
  const ok = await guardarMenuCompleto();
  if(!ok) return;
  await pantallaAdmin('menu');
}
function vincular2xModal(){ _v2xSel=new Set(); _render2x(); abrirModal(); }
function _render2x(){
  const cat=_catSel2x(); if(!cat) return;
  const colores=_coloresDeGrupos(cat);
  const chips=(cat.productos||[]).map((p,i)=>{
    if(!_soporta2x(p)) return '';
    const col=p.grupo?colores[p.grupo]:null, sel=_v2xSel.has(i), info=_info2x(p);
    const par = p.grupo ? (info.conf?`par $${(info.par||0).toLocaleString('es-CL')}`:`<span style="color:var(--bad)">definí el par en Editar precios</span>`) : '';
    return `<button type="button" onclick="_tog2x(${i})" style="text-align:left;cursor:pointer;padding:9px 10px;border-radius:10px;background:var(--panel);color:var(--ink);border:${col?('2px solid '+col):'1px solid var(--line)'};outline:${sel?'3px solid var(--accent)':'none'};outline-offset:1px;display:flex;flex-direction:column;gap:2px">
      <span style="display:flex;align-items:center;gap:6px">
        <span style="width:9px;height:9px;border-radius:50%;flex:none;${col?('background:'+col):'border:1.5px solid var(--muted)'}"></span>
        <span style="font-weight:600;font-size:14px">${p.nombre}</span>
        ${col?`<span style="margin-left:auto;font-size:11px;font-weight:700;color:${col};border:1px solid ${col};border-radius:6px;padding:0 5px">2×</span>`:''}
      </span>
      <span style="font-size:12px;color:var(--muted)">$${(info.u||0).toLocaleString('es-CL')}${par?' · '+par:''}</span>
    </button>`;
  }).join('');
  const n=_v2xSel.size;
  $('#modalBody').innerHTML = `<h3>🔗 Vincular promos 2× — ${cat.nombre}</h3>
    <div class="lbl">Tocá dos o más productos y presioná “Vincular en 2×”. Los que comparten color se emparejan entre sí en la promo. El precio del par se afina en “Editar precios”.</div>

// ---------- Editor de comanda (07-jul-2026): Christian disena su comanda ----------
// Reusa el motor tema-driven de impresora.py. El navegador SOLO edita el "tema"
// (orden/estilo de bloques + globales) y lo guarda; el preview muestra las LINEAS
// reales del pedido demo (que las calcula el backend en _bloque_lineas) con el estilo
// elegido, asi no hay que re-implementar la logica de contenido aca. La impresion de
// prueba manda a la termica los bytes ESC/POS reales del tema (fidelidad total).
let _temaC=null, _lineasC={}, _etiqC={}, _selC=null, _anchoC=48, _dragC=null;
const _EC_TAM={n:'Normal', da:'Grande', dd:'Extra grande'};
const _EC_PX={n:12, da:15, dd:18};

async function contenidoComanda(){
  const d = await (await fetch('/api/tema-comanda')).json();
  _temaC=d.tema; _lineasC=d.lineas||{}; _etiqC=d.etiquetas||{}; _anchoC=d.ancho||48;
  _selC=(_temaC.bloques[0]||{}).id;
  return `<div id="ecRoot"></div>`;
}
function _ecBl(id){ return _temaC.bloques.find(b=>b.id===id); }

function renderEditorComanda(){
  const root=document.getElementById('ecRoot'); if(!root||!_temaC) return;
  const lista=_temaC.bloques.map((b,i)=>`
    <div class="ecblk${b.id===_selC?' sel':''}" draggable="true" data-i="${i}" data-id="${b.id}"
      style="display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:${b.id===_selC?'var(--chip)':'#fff'};${b.on?'':'opacity:.5;'}cursor:grab">
      <span style="color:var(--muted)">⠿</span>
      <span style="flex:1;font-size:13px;font-weight:600">${_etiqC[b.id]||b.id}</span>
      <button class="mini" onclick="ecToggle('${b.id}')" title="Mostrar/ocultar">${b.on?'👁':'🚫'}</button>
      <button class="mini" onclick="ecMover('${b.id}',-1)">▲</button>
      <button class="mini" onclick="ecMover('${b.id}',1)">▼</button>
    </div>`).join('');
  const b=_ecBl(_selC)||{};
  const props=`<div style="background:var(--chip);border-radius:9px;padding:10px;margin:8px 0">
    <div style="font-weight:700;font-size:13px;margin-bottom:7px">Bloque: ${_etiqC[_selC]||_selC}</div>
    <div class="lbl">Tamaño de letra</div>
    <div class="seg">${['n','da','dd'].map(v=>`<button class="${b.tam===v?'on':''}" onclick="ecSetTam('${v}')">${_EC_TAM[v]}</button>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-top:8px;align-items:center">
      <button class="mini ${b.bold?'go':''}" onclick="ecSetBold()">Negrita</button>
      <div class="seg">${[['l','Izquierda'],['c','Centrado']].map(x=>`<button class="${b.al===x[0]?'on':''}" onclick="ecSetAl('${x[0]}')">${x[1]}</button>`).join('')}</div>
    </div></div>`;
  const g=_temaC;
  const glob=`<div style="background:var(--chip);border-radius:9px;padding:10px;margin:8px 0">
    <div style="font-weight:700;font-size:13px;margin-bottom:7px">Ajustes del ticket</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <button class="mini ${g.mayus?'go':''}" onclick="ecSetGlob('mayus',${!g.mayus})">MAYÚSCULAS</button>
      <span class="lbl" style="margin:0 0 0 4px">Separar bloques:</span>
      <div class="seg">${[['guiones','Líneas'],['blanco','Espacio'],['nada','Nada']].map(x=>`<button class="${g.separador===x[0]?'on':''}" onclick="ecSetGlob('separador','${x[0]}')">${x[1]}</button>`).join('')}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span class="lbl" style="min-width:110px;margin:0">Interlineado</span><input type="range" min="1" max="2" step="0.1" value="${g.inter}" oninput="ecSetGlob('inter',+this.value)" style="flex:1"><span style="font-size:12px;min-width:24px">${(+g.inter).toFixed(1)}</span></div>
    <div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span class="lbl" style="min-width:110px;margin:0">Entre letras</span><input type="range" min="0" max="4" step="1" value="${g.track}" oninput="ecSetGlob('track',+this.value)" style="flex:1"><span style="font-size:12px;min-width:24px">${g.track}</span></div>
    <div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span class="lbl" style="min-width:110px;margin:0">Espacio extra</span><input type="range" min="0" max="3" step="1" value="${g.sep}" oninput="ecSetGlob('sep',+this.value)" style="flex:1"><span style="font-size:12px;min-width:24px">${g.sep}</span></div></div>`;
  const botones=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
    <button class="btn primary" style="flex:1;min-width:130px" onclick="ecGuardar()">Guardar diseño</button>
    <button class="btn ghost" onclick="ecImprimirPrueba()">🖨 Imprimir prueba</button>
    <button class="btn ghost" onclick="ecReset()">Descartar cambios</button></div>`;
  root.innerHTML=`<div class="lbl">Arrastrá o usá ▲▼ para reordenar · tocá un bloque para editarlo</div>
    ${lista}${props}${glob}
    <div class="lbl">Vista del ticket (aprox. — la impresión real la valida "Imprimir prueba")</div>
    ${ecPreviewHTML()}${botones}`;
  [...root.querySelectorAll('.ecblk')].forEach(el=>{
    el.addEventListener('click',e=>{ if(e.target.closest('button'))return; _selC=el.dataset.id; renderEditorComanda(); });
    el.addEventListener('dragstart',()=>{_dragC=+el.dataset.i; el.style.opacity='.4';});
    el.addEventListener('dragend',()=>{el.style.opacity='';});
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',e=>{e.preventDefault(); const to=+el.dataset.i; if(_dragC==null||_dragC===to)return; const m=_temaC.bloques.splice(_dragC,1)[0]; _temaC.bloques.splice(to,0,m); _dragC=null; renderEditorComanda();});
  });
}
function ecPreviewHTML(){
  const cols=(_anchoC===48?44:30), w=cols+'ch';
  const sep=_temaC.separador==='guiones'?`<div style="white-space:pre">${'-'.repeat(cols)}</div>`:(_temaC.separador==='blanco'?'<div>&nbsp;</div>':'');
  const parts=_temaC.bloques.filter(b=>b.on).map(b=>{
    const lineas=b.id==='qr'?['[ QR WhatsApp ]']:(_lineasC[b.id]||[]);
    if(!lineas.length) return null;
    const px=_EC_PX[b.tam]||12;
    const st=`font-size:${px}px;font-weight:${b.bold||b.tam!=='n'?'700':'400'};text-align:${b.al==='c'?'center':'left'}`;
    return lineas.map(t=>`<div style="white-space:pre;${st}">${((t||'')+'').replace(/</g,'&lt;')||'&nbsp;'}</div>`).join('');
  }).filter(Boolean);
  const spacer=_temaC.sep?`<div style="height:${_temaC.sep*6}px"></div>`:'';
  return `<div style="background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;width:${w};max-width:100%;overflow-x:auto;line-height:${_temaC.inter};letter-spacing:${_temaC.track}px;text-transform:${_temaC.mayus?'uppercase':'none'}">${parts.join(sep+spacer)}</div>`;
}
function ecToggle(id){ const b=_ecBl(id); if(b){b.on=!b.on; renderEditorComanda();} }
function ecMover(id,dir){ const a=_temaC.bloques, i=a.findIndex(b=>b.id===id), j=i+dir; if(i<0||j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; renderEditorComanda(); }
function ecSetTam(v){ const b=_ecBl(_selC); if(b){b.tam=v; renderEditorComanda();} }
function ecSetBold(){ const b=_ecBl(_selC); if(b){b.bold=!b.bold; renderEditorComanda();} }
function ecSetAl(v){ const b=_ecBl(_selC); if(b){b.al=v; renderEditorComanda();} }
function ecSetGlob(k,v){ _temaC[k]=v; renderEditorComanda(); }

}
const pesos = n => '$' + (n||0).toLocaleString('es-CL');
const itemNotas = it => [it.armado, it.variedad, it.comentario].filter(Boolean).join(' · ');  // armado + sabor + comentario -> notas del item

// ---------- pago combinado (varios metodos que suman el total) ----------
function setPagoSimple(){ pagosUI=null; pagoConUI=null; }
function renderPagoResumen(){
  const r=$('#pagoMixtoResumen'); if(!r) return;
  if(pagosUI && pagosUI.length){
    r.style.display='block';
    r.innerHTML = 'Pago dividido: ' + pagosUI.map(p=>`${p.metodo} ${pesos(p.monto)}`).join(' + ');
  } else r.style.display='none';
}
function dividirPagoModal(){
  if(!pedido.length){ toast('Primero agrega productos'); return; }
  const metodos=(MENU.local.pago||[]), total=totalActual||0, montos={};
  metodos.forEach(m=>montos[m]=0);
  if(pagosUI) pagosUI.forEach(p=>{ montos[p.metodo]=(montos[p.metodo]||0)+p.monto; });
  $('#modalBody').innerHTML = `<h3>Dividir pago — total ${pesos(total)}</h3>
    <div class="lbl">Cuánto se paga con cada método. En efectivo, escribe lo que el cliente entrega — el vuelto se calcula solo.</div>
    ${metodos.map(m=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0">
      <span style="flex:1;text-transform:capitalize">${m}</span>
      <input type="number" min="0" data-m="${m}" value="${montos[m]||''}" placeholder="0"
        style="width:130px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px"></div>`).join('')}
    <div id="divEstado" class="descuadre"></div>
    <div id="vueltoDiv" class="vuelto"></div>
    <button class="btn primary" id="okDiv">Usar este reparto</button>
    <button class="btn ghost" onclick="setPagoSimple();renderPagoResumen();cerrarModal()">Volver a pago simple</button>
    <button class="btn ghost no-print" onclick="cerrarModal()">Cancelar</button>`;
  let efAplicado=0;
  const refresh=()=>{
    // El efectivo tipeado es lo RECIBIDO; lo que APLICA al total se capa a lo que falta
    // cubrir (nunca mas que eso), y el resto es vuelto. Asi "pasarse" en efectivo nunca
    // rompe el cuadre: siempre se resuelve como vuelto, no como error.
    const otros = metodos.filter(m=>m!=='efectivo').reduce((a,m)=>a+(+montos[m]||0),0);
    const efRecibido = +montos['efectivo']||0;
    const faltaCubrir = Math.max(0, total-otros);
    efAplicado = Math.min(efRecibido, faltaCubrir);
    const vuelto = Math.max(0, efRecibido-efAplicado);
    const falta = total-(otros+efAplicado);
    const el=$('#divEstado'), ok=$('#okDiv'), ve=$('#vueltoDiv');
    el.innerHTML = falta===0?'<span class="ok">✓ Cuadra con el total</span>':`<span class="warn">Falta ${pesos(falta)}</span>`;
    if(ok) ok.disabled = falta!==0;
    ve.innerHTML = vuelto>0?`Vuelto: ${pesos(vuelto)}`:'';
  };
  $('#modalBody').querySelectorAll('input[data-m]').forEach(inp=>inp.oninput=()=>{ montos[inp.dataset.m]=+inp.value||0; refresh(); });
  $('#okDiv').onclick=()=>{
    pagosUI = metodos.filter(m=> m==='efectivo' ? efAplicado>0 : (+montos[m]||0)>0)
      .map(m=> m==='efectivo' ? {metodo:'efectivo',monto:efAplicado} : {metodo:m,monto:+montos[m]});
    const efRecibido=+montos['efectivo']||0;
    pagoConUI = (efAplicado>0 && efRecibido>efAplicado) ? efRecibido : null;
    if(!pagosUI.length) setPagoSimple();
    renderPagoResumen(); cerrarModal();
  };
  refresh(); abrirModal();
}

function renderProds(){

      p.variantes.forEach(v=>{
        html += `<button class="prod" onclick="addDirecto(${catActual},${i},'${v.valor}')">
          <span class="n">${p.nombre} · ${v.label} ${b2x}</span>

      // Lata CCU (02-jul, punto G): un boton por sabor, agrega directo (1 clic, sin
      // pasar por el picker de 2 pasos) + un boton generico al final para cuando la
      // venta es indefinida (el sabor real se anota despues en el comentario del item).
      p.variedades.forEach(v=>{
        html += `<button class="prod" onclick="addDirectoSabor(${catActual},${i},'${v.replace(/'/g,"\\'")}')">
          <span class="n">${p.nombre} · ${v} ${b2x}</span>

      });

      html += `<button class="prod" onclick="clickProd(${catActual},${i})">
        <span class="n">${p.nombre} ${b2x}</span>

// ---------- agregar (toque-confirma; picker con armado/sabor cuando hace falta) ----------
function clickProd(ci,pi){
  const cat = MENU.categorias[ci], p = cat.productos[pi];
  const tieneVar=p.variantes.length, tieneSab=p.variedades.length, tieneArm=(p.armados||[]).length;
  if(!tieneVar && !tieneSab && !tieneArm){ addItem(cat.nombre,p,null,null,null,p.precio_desde); return; }
  // Solo variante (sin sabor ni armado): tocar la variante AGREGA directo (puntos 2 y 10)
  if(tieneVar && !tieneSab && !tieneArm){ pickerVarianteDirecto(cat,p); return; }
  // Hay sabor o armado: picker combinable con botón "Agregar"
  pickerCompleto(cat,p);
}

// Desagrupados (papas/salchipapas): el botón ya trae el tamaño -> agrega directo
function addDirecto(ci,pi,valor){
  const cat=MENU.categorias[ci], p=cat.productos[pi];
  const v=p.variantes.find(x=>x.valor===valor);
  addItem(cat.nombre,p,valor,null,null,v?v.precio:p.precio_desde);
}

// Desagrupados por SABOR (Lata CCU, punto G 02-jul): el botón ya trae el sabor ->
// agrega directo, 1 solo clic. sabor='' = el botón genérico (venta indefinida).
function addDirectoSabor(ci,pi,sabor){
  const cat=MENU.categorias[ci], p=cat.productos[pi];
  addItem(cat.nombre,p,null,sabor||null,null,p.precio_desde);

function pickerVarianteDirecto(cat,p){
  $('#modalBody').innerHTML = `<h3>${p.nombre}</h3>${p.desc?`<div class="lbl">${p.desc}</div>`:''}

function pickerCompleto(cat,p){
  let selVar = p.variantes.length?null:undefined, selSab=null, selArm=null;
  const render=()=>{
    $('#modalBody').innerHTML = `
      <h3>${p.nombre}</h3>${p.desc?`<div class="lbl">${p.desc}</div>`:''}
      ${p.variantes.length?`<div class="lbl">Variante</div><div class="opts" id="ov">
        ${p.variantes.map(v=>`<div class="opt ${selVar===v.valor?'sel':''}" data-v="${v.valor}">${v.label} · ${pesos(v.precio)}</div>`).join('')}</div>`:''}
      ${p.variedades.length?`<div class="lbl">Sabor / variedad</div><div class="opts" id="os">
        ${p.variedades.map(s=>`<div class="opt ${selSab===s?'sel':''}" data-s="${s}">${s}</div>`).join('')}</div>`:''}
      ${(p.armados||[]).length?`<div class="lbl">Armado (opcional)</div><div class="opts" id="oa">
        ${p.armados.map(a=>`<div class="opt ${selArm===a?'sel':''}" data-a="${a}">${a}</div>`).join('')}</div>`:''}
      <button class="btn primary" id="okAdd">Agregar al pedido</button>
      <button class="btn ghost no-print" onclick="cerrarModal()">Cancelar</button>`;
    $('#ov')?.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{selVar=o.dataset.v;render()});
    $('#os')?.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{selSab=(selSab===o.dataset.s?null:o.dataset.s);render()});
    $('#oa')?.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{selArm=(selArm===o.dataset.a?null:o.dataset.a);render()});
    $('#okAdd').onclick=()=>{
      if(p.variantes.length && !selVar){toast('Elige una variante');return;}
      const vObj = p.variantes.find(v=>v.valor===selVar);
      addItem(cat.nombre, p, selVar||null, selSab, selArm, vObj?vObj.precio:p.precio_desde);
      cerrarModal();
    };
  };
  render(); abrirModal();
}

function addItem(categoria, p, variante, sabor, armado, precio){
  const variedad = sabor||"", arm = armado||"";
  // merge por producto+variante+sabor+armado (NO por comentario, que se agrega después).
  // El armado va luego a 'notas'; como el tarificador agrupa por cat/producto/variante,
  // dos del mismo producto con armado distinto igual forman la promo 2x.
  const ex = pedido.find(it=>it.categoria===categoria && it.producto===p.nombre
    && it.variante===variante && it.variedad===variedad && it.armado===arm);
  if(ex) ex.cantidad++;
  else pedido.push({categoria,producto:p.nombre,variante,
    varLabel:variante?(p.variantes.find(v=>v.valor===variante)||{}).label:'',
    variedad,armado:arm,comentario:"",cantidad:1,precio});
  renderPedido();
}

function ocultarSugerencias(){ ['#sugerencias','#sugerenciasTel'].forEach(id=>{ const sg=$(id); if(sg){ sg.style.display='none'; sg.innerHTML=''; } }); }

// El local ya usa la convencion "(monto) direccion" o "[monto] direccion" en
// direcciones reales (ej: clientes importados) para marcar el cobro de esa zona.
// Se toma ese monto solo, no se inventa nada. El delimitador es OBLIGATORIO: un
// numero suelto al inicio (sin parentesis ni corchetes) puede ser parte real de
// la calle (ej. "12 de Marzo", calles con nombre de fecha) y NO se puede asumir
// que sea un monto — bug real encontrado y corregido con Gonza el 2026-07-01.
const RE_PREFIJO_MONTO = /^[(\[]\s*\$?\s*(\d+)\s*[)\]]\s*/;
function recalcularCobroDelivery(){
  if(modalidad!=='delivery') return;
  const dirEl=$('#direccion'), cobroEl=$('#deliveryCobro');
  if(!dirEl || !cobroEl) return;
  const m=(dirEl.value||'').trim().match(RE_PREFIJO_MONTO);
  const monto=m?(+m[1]||0):0;
  cobroEl.value=monto;
  actualizarTotal();
  if(monto===0) toast('Cobro delivery $0', 1000);
}

// Reparacion automatica de direcciones (punto: autosanar el prefijo "(monto)").
// Blindaje "a prueba de fuego": el prefijo puede venir con corchetes [1500] o ya
// bien formado (1500) — siempre se quita ENTERO (parentesis o corchetes + numero
// + cierre) y se reemplaza por el monto ACTUAL del campo, redondeado a entero y
// nunca negativo. Si no hay prefijo CON delimitador, se agrega sin tocar el resto
// del texto (un numero suelto al inicio, sin delimitador, no cuenta como prefijo).
function quitarPrefijoMontoDireccion(direccion){
  return (direccion||'').trim().replace(RE_PREFIJO_MONTO, '').trim();
}
function direccionConMonto(direccion, monto){
  const resto = quitarPrefijoMontoDireccion(direccion);
  const m = Math.max(0, Math.round(+monto || 0));   // SOLO entero, nunca negativo/decimal
  return `(${m}) ${resto}`.trim();
}
// Edicion SIN restringir a un rol (cualquier cajero logueado puede corregir el precio
// guardado del cliente al cobrar un delivery real). PENDIENTE (anotado por Gonza,
// 2026-07-01): blindar esto a futuro con aprobacion de admin antes de guardar el
// cambio (como el PIN de un supervisor en caja de supermercado) — falta un permiso
// nuevo tipo 'autorizar_precio_delivery' y su flujo de aprobacion.
function autosanarDireccionCliente(){
  if(modalidad!=='delivery') return;
  const dirEl=$('#direccion'), cobroEl=$('#deliveryCobro');
  if(!dirEl || !cobroEl || !dirEl.value.trim()) return;
  dirEl.value = direccionConMonto(dirEl.value, cobroEl.value);
}

// Un mismo telefono puede repartir a mas de un lugar (casa, trabajo, etc). Con 0 o 1
// direccion guardada no se muestra nada (ya se autocompleta solo con la ultima usada);
// con 2+ se ofrece un selector de BOTONES (no <select>, ver convencion del proyecto)
// para que el cajero elija sin tener que reescribir la direccion ni el cobro.
async function cargarDireccionesGuardadas(telefono){
  const cont=$('#direccionesGuardadas'), box=$('#boxDireccionesGuardadas');
  if(!cont || !box) return;
  if(modalidad!=='delivery'){ box.style.display='none'; cont.innerHTML=''; return; }
  const d=soloDigitos(telefono);
  if(d.length<8){ box.style.display='none'; cont.innerHTML=''; return; }
  let r; try{ r=await (await fetch('/api/clientes/'+encodeURIComponent(d)+'/direcciones')).json(); }catch(e){ return; }
  const dirs=r.direcciones||[];
  if(dirs.length<2){ box.style.display='none'; cont.innerHTML=''; return; }
  window._dirs=dirs;
  cont.innerHTML = dirs.map((dd,i)=>`<button type="button" onclick="elegirDireccion(${i})">${dd.direccion} · $${dd.delivery_cobro}</button>`).join('');
  box.style.display='block';
}
function elegirDireccion(i){
  const d=(window._dirs||[])[i]; if(!d) return;
  const dirEl=$('#direccion'), cobroEl=$('#deliveryCobro');
  if(dirEl) dirEl.value=direccionConMonto(d.direccion, d.delivery_cobro);
  if(cobroEl) cobroEl.value=Math.max(0, Math.round(+d.delivery_cobro||0));
  $('#direccionesGuardadas').querySelectorAll('button').forEach((b,bi)=>b.classList.toggle('on',bi===i));
  actualizarTotal();
}

function varLabelDe(categoria, producto, variante){
  if(!variante) return '';
  const cat=(MENU.categorias||[]).find(c=>c.nombre===categoria);
  const prod=cat&&cat.productos.find(p=>p.nombre===producto);
  const v=prod&&prod.variantes.find(x=>x.valor===variante);
  return v?v.label:variante;
}
async function editarPedido(id){
  let p; try{ p=await (await fetch('/api/pedidos/'+id)).json(); }catch(e){ toast('No se pudo cargar el pedido'); return; }

    varLabel:varLabelDe(it.categoria,it.producto,it.variante), variedad:'', armado:'', comentario:it.notas||'',
    cantidad:it.cantidad||1, precio:it.precio_unitario||0}));

async function crearPedido(){
  if(!pedido.length) return;
  if(!CAJA){ toast('Abre la caja primero'); abrirCajaModal(); return; }
  autosanarDireccionCliente();   // graba el (monto) real cobrado en la direccion del cliente
  const body={
    canal:"cajero",
    cliente:$('#cliente').value.trim(),
    modalidad,
    items:pedido.map(it=>({categoria:it.categoria,producto:it.producto,variante:it.variante,cantidad:it.cantidad,notas:itemNotas(it)})),
    forma_pago:formaPago,
    direccion: modalidad==='delivery'?$('#direccion').value.trim():null,
    delivery_cobro: modalidad==='delivery'?(+$('#deliveryCobro').value||0):0,
    notas:$('#notas').value.trim(),
    pago_con: pagosUI ? pagoConUI : ((formaPago==='efectivo' && +$('#pagaCon').value) ? (+$('#pagaCon').value) : null),
    telefono: (modalidad!=='local') ? soloDigitos($('#telefono').value) : null,
    mesa: (modalidad==='local') ? ($('#mesa').value||'').trim() : null,
    pagos: (pagosUI && pagosUI.length) ? pagosUI : null,   // pago dividido (si se usó)
  };
  const url = editandoId ? ('/api/pedidos/'+editandoId) : '/api/pedidos';
  const res = await fetch(url,{method: editandoId?'PUT':'POST',headers:headersConUsuario(),body:JSON.stringify(body)});
  if(!res.ok){ const e=await res.json(); toast('Error: '+(e.detail||'no se pudo guardar')); return; }
  const p = await res.json();
  if(editandoId){ toast(`Pedido #${p.id} actualizado · ${pesos(p.total)}`); editandoId=null; marcarEdicion(false); }
  else { toast(p.vuelto!=null ? `Pedido #${p.id} · ${pesos(p.total)} · Vuelto ${pesos(p.vuelto)}`
                              : `Pedido #${p.id} creado · ${pesos(p.total)}`); }
  // Si este pedido venia de un aviso de rechazado, el aviso se apaga SOLO al quedar
  // ingresado (21-jul-2026): el problema se resolvio, no hay nada que descartar a mano.
  if(!editandoId && rechazadoEnCurso!=null){
    const fid = rechazadoEnCurso; rechazadoEnCurso = null;
    try{ await fetch('/api/bot/rechazados/'+fid+'/descartar',{method:'POST',
      headers:headersConUsuario(),
      body:JSON.stringify({motivo:'ingresado a mano como pedido #'+p.id})}); }catch(e){}
    pollBot();
  }
  // Igual para los PENDIENTES (29-jul-2026): el pedido acaba de entrar a ESTA cola
  // con su comanda, así que el aviso ya no tiene razón de existir. Se cierra solo --
  // depender de que alguien se acuerde de apagarlo a mano es como no tener el botón.
  if(!editandoId && pendienteEnCurso!=null){
    const fid = pendienteEnCurso; pendienteEnCurso = null;
    try{ await fetch('/api/bot/pendientes/'+fid+'/descartar',{method:'POST',
      headers:headersConUsuario(),
      body:JSON.stringify({motivo:'ingresado a mano como pedido #'+p.id})}); }catch(e){}
    pollBot();
  }
  limpiarPedido(); $('#direccion') && ($('#direccion').value=''); refrescarCaja();
  // 12-ago-2026 (pedido de Christian): en el celular, apenas el pedido entra hay que VERLO en
  // la cola. Antes quedaba en la pestaña del menu y habia que ir a buscar la cola a mano, que
  // en pantalla chica es el paso mas molesto de todos.
  // El await no estaba antes (cargarCola se llamaba y seguia de largo): se agrega para que la
  // pestaña se abra con el pedido nuevo YA pintado y no vacia por medio segundo. Es lo ultimo
  // de la funcion, asi que no cambia el orden de nada mas.
  await cargarCola();
  if(esPantallaMovil()) setTabMovil(2);
}

// ---------- Ciclo del DELIVERY con paso intermedio (29-jul-2026, pedido de Gonza) ----------
// El motor SIEMPRE tuvo el paso intermedio: `listo` es un estado que NO saca al pedido de
// la cola (nucleo.py: en_preparacion -> {entregado, listo} ; listo -> {entregado}). La
// pantalla nunca lo usó y saltaba de EN PREPARACIÓN directo a ENTREGADO, así que un
// delivery que ya iba en la moto desaparecía de la cola y nadie sabía si había llegado.
//
// Ahora, SOLO para delivery: "Entregado" pasa el pedido a `listo`, que se muestra como
// EN REPARTO y sigue en la cola; recién el botón "Listo" lo cierra. Retiro y local quedan
// exactamente igual que siempre — un botón que termina el pedido.
//
// Por eso este cambio NO obliga a recompilar el .exe: es solo esta pantalla, que el POS
// lee del disco en cada carga (rutas.py -> HTML_CAJERO).
const esReparto = p => p.estado==='listo' && p.modalidad==='delivery';
const etiquetaEstado = p => esReparto(p) ? 'en reparto' : p.estado.replace('_',' ');
const claseEstado = p => p.estado + (esReparto(p) ? ' reparto' : '');

function botonesEstado(p){
  const id=p.id, cancel=puede('anular')?`<button class="mini cancel" onclick="mover(${id},'cancelado')">Cancelar</button>`:'';
  if(p.estado==='recibido'||p.estado==='confirmado')
    return `<button class="mini go" onclick="aCocina(${id})">A cocina</button>`+cancel;   // imprime al mandar a cocina
  if(p.estado==='en_preparacion'){
    // Delivery: "Entregado" ya no cierra el pedido, lo manda EN REPARTO.
    if(p.modalidad==='delivery')
      return `<button class="mini go" onclick="mover(${id},'listo')">Entregado</button>`+cancel;
    // 04-ago-2026 (P29, pedido de Gonza): un retiro/local PROGRAMADO cierra con
    // "Retirado" en vez de "Entregado" -- misma transicion de siempre (-> entregado),
    // solo cambia la etiqueta para que quede claro que es el cliente retirando lo que
    // esperaba, no una entrega recien salida de cocina.
    return `<button class="mini go" onclick="mover(${id},'entregado')">${p.hora_programada?'Retirado':'Entregado'}</button>`+cancel;
  }
  if(p.estado==='listo')   // en reparto (o un 'listo' de retiro): este botón sí lo saca de la cola
    return `<button class="mini go" onclick="mover(${id},'entregado')">Listo</button>`+cancel;
  return '';
}
async function mover(id,estado){
  const r=await fetch(`/api/pedidos/${id}/estado`,{method:'POST',headers:headersConUsuario(),body:JSON.stringify({estado})});
  if(!r.ok){ const e=await r.json(); toast('Error: '+(e.detail||'')); return; }
  if(estado==='entregado') toast(`Pedido #${id} entregado`);
  if(estado==='listo')     toast(`Pedido #${id} salió en reparto`);
  cargarCola();
}
async function aCocina(id){   // manda a cocina Y dispara la impresion automatica de la comanda
  await mover(id,'en_preparacion');
  imprimirTermica(id);
}

const hoyISO = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
async function informeVentas(desde, hasta){
  desde = desde || hoyISO(); hasta = hasta || hoyISO();
  let inf; try{ inf=await (await fetch(`/api/ventas?desde=${desde}&hasta=${hasta}`)).json(); }catch(e){ toast('No se pudo cargar el informe'); return; }

    .map(([k,v])=>`<tr><td style="text-transform:capitalize">${k}</td><td style="text-align:right">${pesos(v)}</td></tr>`).join('')
    || `<tr><td colspan="2" style="color:var(--muted)">Sin ventas en el rango</td></tr>`;
  const filas = (inf.pedidos||[]).slice().reverse().map(p=>{
    const cancel = p.estado==='cancelado';
    const pg = (p.pagos&&p.pagos.length)? p.pagos.map(x=>`${x.metodo} ${pesos(x.monto)}`).join(' + ') : (p.forma_pago||'—');
    const hora = (p.creado_en||'').slice(11,16);
    return `<tr style="${cancel?'opacity:.55':''}">
      <td>#${p.id}<br><span style="color:var(--muted);font-size:11px">${hora}</span></td>
      <td>${p.cliente||'—'}<br><span style="color:var(--muted);font-size:11px">${p.modalidad}${cancel?' · CANCELADO':''}</span></td>
      <td style="text-align:right">${pesos(p.total)}<br><span style="color:var(--muted);font-size:11px">${pg}</span></td>
      <td style="text-align:right">${(cancel||!puede('redistribuir_pago'))?'':`<button class="mini" onclick="editarPagoModal(${p.id})">Pago</button>`}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="4" style="color:var(--muted)">Sin comandas en el rango</td></tr>`;
  $('#modalBody').innerHTML = `<h3>Informe de ventas</h3>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
      <span class="lbl" style="margin:0">Desde</span><input type="date" id="infDesde" value="${desde}" style="padding:6px;border:1px solid var(--line);border-radius:7px">
      <span class="lbl" style="margin:0">Hasta</span><input type="date" id="infHasta" value="${hasta}" style="padding:6px;border:1px solid var(--line);border-radius:7px">
      <button class="cj-btn cerrar" onclick="informeVentas($('#infDesde').value,$('#infHasta').value)">Ver</button>
    </div>
    <table class="tabla">
      <tr><td>Comandas</td><td style="text-align:right">${inf.n_pedidos}</td></tr>
      <tr><td>Ventas totales</td><td style="text-align:right"><b>${pesos(inf.total_ventas)}</b></td></tr>
      ${inf.total_cancelado?`<tr><td>Canceladas (no suman)</td><td style="text-align:right">${pesos(inf.total_cancelado)}</td></tr>`:''}
      <tr><td colspan="2" class="sub-h">Por forma de pago</td></tr>
      ${metodos}
    </table>
    <div class="sub-h">Detalle de comandas (toca "Pago" para redistribuir)</div>
    <table class="tabla">${filas}</table>
    <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>`;
  abrirModal();
}
async function editarPagoModal(id){
  let p; try{ p=await (await fetch('/api/pedidos/'+id)).json(); }catch(e){ toast('No se pudo cargar'); return; }
  if(p.detail){ toast(p.detail); return; }
  const metodos=(MENU.local.pago||[]), total=p.total||0, montos={};
  metodos.forEach(m=>montos[m]=0);
  (p.pagos||[]).forEach(x=>{ montos[x.metodo]=(montos[x.metodo]||0)+x.monto; });
  if(!(p.pagos&&p.pagos.length) && p.forma_pago && montos[p.forma_pago]!==undefined) montos[p.forma_pago]=total;
  $('#modalBody').innerHTML = `<h3>Pago de la comanda #${id}</h3>
    <div class="lbl">Redistribuye el total ${pesos(total)} entre métodos (no cambia los productos). En efectivo, escribe lo que el cliente entrega — el vuelto se calcula solo.</div>
    ${metodos.map(m=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0">
      <span style="flex:1;text-transform:capitalize">${m}</span>
      <input type="number" min="0" data-m="${m}" value="${montos[m]||''}" placeholder="0"
        style="width:130px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px"></div>`).join('')}
    <div id="epEstado" class="descuadre"></div>
    <div id="vueltoEP" class="vuelto"></div>
    <button class="btn primary" id="epOk">Guardar pago</button>
    <button class="btn ghost" onclick="informeVentas(window._inf&&window._inf.desde,window._inf&&window._inf.hasta)">Volver al informe</button>`;
  let efAplicado=0;
  const refresh=()=>{
    // Mismo criterio que dividirPagoModal: el efectivo tipeado es lo RECIBIDO; lo que
    // APLICA se capa a lo que falta cubrir, el resto es vuelto (nunca "te pasaste").
    const otros = metodos.filter(m=>m!=='efectivo').reduce((a,m)=>a+(+montos[m]||0),0);
    const efRecibido = +montos['efectivo']||0;
    const faltaCubrir = Math.max(0, total-otros);
    efAplicado = Math.min(efRecibido, faltaCubrir);
    const vuelto = Math.max(0, efRecibido-efAplicado);
    const falta = total-(otros+efAplicado);
    const el=$('#epEstado'), ok=$('#epOk'), ve=$('#vueltoEP');
    el.innerHTML= falta===0?'<span class="ok">✓ Cuadra</span>':`<span class="warn">Falta ${pesos(falta)}</span>`;
    if(ok) ok.disabled=falta!==0;
    ve.innerHTML = vuelto>0?`Vuelto: ${pesos(vuelto)}`:'';
  };
  $('#modalBody').querySelectorAll('input[data-m]').forEach(inp=>inp.oninput=()=>{ montos[inp.dataset.m]=+inp.value||0; refresh(); });
  $('#epOk').onclick=async()=>{
    const pagos = metodos.filter(m=> m==='efectivo' ? efAplicado>0 : (+montos[m]||0)>0)
      .map(m=> m==='efectivo' ? {metodo:'efectivo',monto:efAplicado} : {metodo:m,monto:+montos[m]});
    const efRecibido=+montos['efectivo']||0;
    const body={pagos}; if(efAplicado>0 && efRecibido>efAplicado) body.pago_con=efRecibido;
    const r=await fetch('/api/pedidos/'+id+'/pagos',{method:'POST',headers:headersConUsuario(),body:JSON.stringify(body)});
    if(!r.ok){ const e=await r.json(); toast('Error: '+(e.detail||'no se pudo')); return; }
    toast('Pago actualizado'); refrescarCaja(); informeVentas(window._inf&&window._inf.desde,window._inf&&window._inf.hasta);
  };
  refresh(); abrirModal();
}

function resumenHTML(r){
  // 02-jul: se retira la lista generica "Por forma de pago" y se reemplaza por un
  // bloque de CUADRE por cada metodo (mismo criterio para todos: lo que declara caja

  // ventas); tarjeta/transferencia se concilian contra el resumen del POS de tarjeta
  // o la cartola bancaria, por eso su cuadre es mas simple (solo el total vendido).
  const otros = Object.entries(r.por_metodo||{}).filter(([k])=>k!=='efectivo').sort((a,b)=>b[1]-a[1]);
  const bloquesOtros = otros.map(([k,v])=>`
    <tr><td colspan="2" class="sub-h">Cuadre ${k}</td></tr>
    <tr><td>Ventas en ${k}</td><td style="text-align:right"><b>${pesos(v)}</b></td></tr>`).join('')
    || `<tr><td colspan="2" style="color:var(--muted)">Sin ventas en otros métodos</td></tr>`;
  return `<table class="tabla">
    <tr><td>Pedidos</td><td style="text-align:right">${r.n_pedidos}</td></tr>
    <tr><td>Ventas totales</td><td style="text-align:right"><b>${pesos(r.total_ventas)}</b></td></tr>
    <tr><td colspan="2" class="sub-h">Cuadre efectivo</td></tr>
    <tr><td>Fondo inicial</td><td style="text-align:right">${pesos(r.fondo_inicial)}</td></tr>
    <tr><td>+ Ventas en efectivo</td><td style="text-align:right">${pesos(r.efectivo_ventas)}</td></tr>
    <tr><td><b>= Debería haber en caja</b></td><td style="text-align:right"><b>${pesos(r.esperado_efectivo)}</b></td></tr>
    ${bloquesOtros}

}

async function cerrarCajaModal(){
  const c=await (await fetch('/api/caja')).json();
  if(!c.abierta){ toast('No hay caja abierta'); return; }
  // Blindaje (punto 6): antes de mostrar el conteo, avisar si queda algo sin terminar
  // en la cola, con opciones para resolverlo ahi mismo (evita que un pedido quede
  // colgando de una caja ya cerrada).
  let cola=[]; try{ cola=(await (await fetch('/api/cola')).json()).pedidos||[]; }catch(e){}
  if(cola.length){ mostrarPendientesAntesDeCerrar(cola); return; }
  mostrarPantallaConteo(c.resumen);
}
function botonesPendienteCierre(p){
  // Acá se está CERRANDO LA CAJA: lo que se necesita es terminar el pedido, no darle un
  // paso más. Antes tomaba `sig[0]` de las transiciones, y con el paso de EN REPARTO ese
  // primer destino puede ser `listo` -- el botón habría movido el pedido sin sacarlo de
  // la cola, y el modal lo seguiría mostrando: un bucle. Se pide siempre el estado FINAL.
  const cerrable=(TRANS[p.estado]||[]).includes('entregado');
  const avanzar = cerrable?`<button class="mini go" onclick="resolverPendienteYRefrescar(${p.id},'entregado')">Entregado</button>`:'';
  return avanzar+`<button class="mini cancel" onclick="resolverPendienteYRefrescar(${p.id},'cancelado')">Cancelar</button>`;
}
async function resolverPendienteYRefrescar(id, estado){
  await mover(id, estado);
  cerrarCajaModal();   // vuelve a chequear la cola; si ya quedo vacia, pasa solo al conteo
}
function mostrarPendientesAntesDeCerrar(cola){

    <div class="pedido">
      <div class="top"><span class="id">#${p.id}</span><span class="estado ${claseEstado(p)}">${etiquetaEstado(p)}</span></div>
      <div class="resumen"><b>${p.cliente||'—'}</b> · ${p.modalidad} · ${pesos(p.total)}</div>
      <div class="pie"><span class="t"></span>${botonesPendienteCierre(p)}</div>
    </div>`).join('');
  $('#modalBody').innerHTML = `<h3>⚠ Hay ${cola.length} pedido(s) sin terminar</h3>
    <div class="lbl">Complétalos o cancélalos antes de cerrar la caja, para que no queden colgando de un día ya cerrado.</div>

async function mostrarPantallaConteoForzado(){
